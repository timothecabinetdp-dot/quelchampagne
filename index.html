      related:['feuillatte','moet'] },

    { id:'blanc-blancs', cat:'Décryptage', cover:'linear-gradient(135deg,#ECEEE9,#E1E5DB)', date:'Juillet 2026', read:'4 min',
      title:"Blanc de Blancs ou Blanc de Noirs ?",
      excerpt:"Deux mots, deux mondes. On démêle les cépages et leurs styles.",
      body:`<p>Sur une étiquette de champagne, ces deux mentions racontent le cépage utilisé, et donc le style dans votre verre. Voici comment les distinguer.</p>
<h3>Blanc de Blancs : la fraîcheur</h3>
<p>« Blanc de Blancs » signifie un champagne issu uniquement de raisins blancs, soit du <strong>chardonnay</strong> en Champagne. Résultat : des cuvées vives, florales, minérales, tout en finesse. Le <a href="#" onclick="return openAff('ruinart')">Ruinart Blanc de Blancs</a> en est l'exemple emblématique. Idéal à l'apéritif et sur les fruits de mer.</p>
<h3>Blanc de Noirs : le corps</h3>
<p>« Blanc de Noirs » désigne un champagne blanc élaboré à partir de raisins noirs (<strong>pinot noir</strong> et <strong>pinot meunier</strong>), vinifiés sans macération. Le style est plus ample, vineux, structuré, parfait à table sur une volaille.</p>
<h3>Et l'assemblage classique ?</h3>
<p>La plupart des bruts marient les trois cépages pour équilibrer fraîcheur et corps. C'est le style passe-partout, ni trop léger ni trop puissant.</p>
<h3>Lequel choisir ?</h3>
<p>Envie de fraîcheur et de finesse : blanc de blancs. Envie de corps et de gastronomie : blanc de noirs ou une cuvée à dominante pinot comme la <a href="#" onclick="return openAff('bollinger')">Bollinger Special Cuvée</a>.</p>`,
      related:['ruinart','bollinger'] },

    { id:'servir', cat:'Pratique', cover:'linear-gradient(135deg,#F0ECE6,#E6E0D5)', date:'Juillet 2026', read:'4 min',
      title:"Température, verre, ouverture : servir le champagne",
      excerpt:"Les gestes simples qui subliment, ou gâchent, une belle bouteille.",
      body:`<p>Un grand champagne mal servi perd la moitié de son charme. Trois gestes suffisent à bien faire les choses.</p>
<h3>La température</h3>
<p>Servez entre <strong>8 et 10 °C</strong>, pas plus froid : trop glacé, le champagne s'anesthésie et perd ses arômes. Comptez trois heures au réfrigérateur, ou vingt minutes dans un seau rempli à moitié d'eau et de glace, plus efficace qu'au congélateur.</p>
<h3>Le verre</h3>
<p>Oubliez la coupe large, elle laisse filer les bulles et les arômes. Préférez une <strong>flûte</strong>, ou mieux, un <strong>verre à vin blanc</strong> resserré qui concentre le parfum tout en laissant respirer. C'est le choix des amateurs.</p>
<h3>L'ouverture</h3>
<p>Ne faites pas sauter le bouchon : c'est spectaculaire mais on perd du vin et de la pression. Tenez le bouchon, tournez la bouteille (pas le bouchon), et accompagnez la sortie dans un léger soupir. Servez en deux temps pour maîtriser la mousse.</p>
<h3>Dans quel ordre ?</h3>
<p>Si vous ouvrez plusieurs cuvées, allez du plus léger au plus corsé, et du plus jeune au plus âgé.</p>`,
      related:['ruinart'] },

    { id:'noel', cat:'Guide', cover:'linear-gradient(135deg,#F3ECE8,#E8DAD2)', date:'Juillet 2026', read:'5 min',
      title:"Quel champagne pour Noël et les fêtes",
      excerpt:"Apéritif, repas, minuit : le bon champagne pour chaque moment des fêtes.",
      body:`<p>Les fêtes, c'est le grand moment du champagne. Mais entre l'apéritif, le repas et le passage à minuit, un seul flacon ne fait pas tout. Voici comment couvrir la soirée sans faute de goût.</p>
<h3>Pour l'apéritif</h3>
<p>Ouvrez sur un champagne <strong>frais et vif</strong> qui met en appétit : un brut d'assemblage ou un blanc de blancs. Il lance la soirée sans écraser les papilles avant le repas.</p>
<h3>Pour le repas de fête</h3>
<p>Sur un chapon, une volaille ou des Saint-Jacques, montez en corps avec un champagne <strong>vineux à dominante pinot noir</strong>, comme la <a href="#" onclick="return openAff('bollinger')">Special Cuvée de Bollinger</a>, capable de tenir face aux plats riches.</p>
<h3>Pour le dessert et minuit</h3>
<p>Sur une bûche ou des fruits, un <strong>demi-sec</strong> ou un <strong>rosé fruité</strong> comme la <a href="#" onclick="return openAff('laurentperrier')">Cuvée Rosé de Laurent-Perrier</a> supporte le sucre et apporte une note festive pour trinquer à minuit.</p>
<h3>Quel budget prévoir ?</h3>
<p>Pas besoin de flamber sur toute la soirée : un bon brut pour l'apéritif, une cuvée de caractère pour le repas, et si vous voulez marquer le coup, réservez le prestige pour le toast de minuit.</p>
<p>Vous hésitez entre plusieurs bouteilles ? Le sélecteur les compare en fonction de votre repas, de vos goûts et de votre budget.</p>`,
      related:['clicquot','bollinger','laurentperrier'] },

    { id:'moins-30', cat:'Sélection', cover:'linear-gradient(135deg,#EFEDE6,#E5E1D5)', date:'Juillet 2026', read:'4 min',
      title:"Quel champagne choisir autour de 30 € ?",
      excerpt:"Une méthode et une référence à surveiller dans une zone de prix particulièrement volatile.",
      body:`<p>Autour de 30 €, les prix et les disponibilités changent vite. Cette sélection indique donc une zone de budget, jamais la promesse d'un prix permanent. Il faut contrôler le format, la cuvée exacte et l'offre au moment de l'achat.</p>
<h3>La référence à surveiller : Nicolas Feuillatte Réserve Exclusive</h3>
<p>Son profil frais et fruité en fait une option accessible pour l'apéritif et les grandes tablées lorsque son prix constaté correspond à votre budget.</p>
<div class="aff-inline"><div class="l">Notre sélection · fiche vérifiée</div><div class="n">Nicolas Feuillatte · Réserve Exclusive Brut</div><div class="row"><span style="color:var(--muted);font-size:15px">Budget indicatif : 26–35 €</span><a class="btn btn-ghost btn-sm" href="#" onclick="return openAff('feuillatte')">Voir la fiche officielle ›</a></div></div>
<h3>Sous les 20 € : prudence</h3>
<p>À ce niveau de prix, les offres relevant réellement de l'appellation Champagne sont rares et très variables. Le site préfère ne pas afficher de recommandation tant qu'une bouteille précise, sa disponibilité et son prix n'ont pas été contrôlés.</p>
<h3>Nos conseils pour trouver le bon</h3>
<ul>
<li>Guettez les promotions des grandes maisons, souvent autour des fêtes.</li>
<li>Regardez du côté des vignerons indépendants, qui maîtrisent tout de la vigne à la bouteille.</li>
<li>À prix égal, privilégiez le style que vous aimez plutôt que la notoriété de l'étiquette.</li>
</ul>`,
      related:['feuillatte'] },

    { id:'aperitif', cat:'Guide', cover:'linear-gradient(135deg,#F2EFE7,#E8E1D0)', date:'Juillet 2026', read:'4 min',
      title:"Quel champagne pour un apéritif",
      excerpt:"Vif, léger, convivial : le bon champagne pour lancer la soirée sans se tromper.",
      body:`<p>À l'apéritif, le champagne doit ouvrir l'appétit sans dominer. On cherche la fraîcheur et la vivacité, pas la puissance. Voici comment viser juste, et avec quoi le servir.</p>
<h3>Le bon style</h3>
<p>Privilégiez un champagne frais et fruité : un brut d'assemblage ou un blanc de blancs, tout en tension et en agrumes. On évite à ce stade les cuvées très vineuses, davantage à leur place à table.</p>
<h3>Nos cuvées d'apéritif</h3>
<table>
<thead><tr><th>Envie</th><th>Cuvée</th><th>Budget indicatif</th></tr></thead>
<tbody>
<tr><td>Simple et convivial</td><td><a href="/champagne/feuillatte/">Nicolas Feuillatte Réserve Exclusive</a></td><td>26–35 €</td></tr>
<tr><td>Une valeur sûre reconnue</td><td><a href="/champagne/moet/">Moët Impérial</a></td><td>38–50 €</td></tr>
<tr><td>Fraîcheur minérale (blanc de blancs)</td><td><a href="/champagne/ruinart/">Ruinart Blanc de Blancs</a></td><td>70–90 €</td></tr>
</tbody>
</table>
<h3>Avec quoi le servir ?</h3>
<p>Sur des toasts, des gougères ou des fruits de mer, un blanc de blancs minéral fait merveille. Évitez les bouchées trop sucrées ou trop vinaigrées, qui cassent les bulles. Les fruits de mer sont un accord classique : voyez notre guide <a href="/blog/huitres/">champagne et huîtres</a>.</p>
<h3>À quelle température ?</h3>
<p>Servez bien frais, entre 8 et 10 °C, mais pas glacé : trop froid, le champagne s'anesthésie et perd ses arômes. Un seau d'eau avec des glaçons pendant 20 minutes suffit.</p>
<h3>Et le crémant ?</h3>
<p>Un crémant peut être une alternative effervescente moins chère, avec son profil propre. Il ne relève toutefois pas de l'appellation Champagne, et reste volontairement hors de notre sélecteur.</p>
<p>Pour préparer l’apéritif, indiquez le style recherché et votre budget : le sélecteur compare ensuite les bouteilles disponibles.</p>`,
      related:['feuillatte','moet','ruinart'] },

    { id:'huitres', cat:'Accords', cover:'linear-gradient(135deg,#EAEEEC,#DDE6E0)', date:'Juillet 2026', read:'4 min',
      title:"Quel champagne avec des huîtres et des fruits de mer",
      excerpt:"L'accord iodé par excellence : le style qui sublime coquillages et crustacés.",
      body:`<p>Huîtres, coquillages, crustacés : peu d'accords sont aussi naturels que celui du champagne et de la mer. Encore faut-il le bon style.</p>
<h3>Cap sur la minéralité</h3>
<p>Pour les huîtres, on veut un champagne <strong>vif, tendu et minéral</strong> : un blanc de blancs 100 % chardonnay est l'accord roi. Sa fraîcheur saline prolonge l'iode sans l'écraser. Le <a href="#" onclick="return openAff('ruinart')">Ruinart Blanc de Blancs</a> est une référence.</p>
<h3>Sec, voire très sec</h3>
<p>Un brut ou un extra-brut est souvent cohérent avec l'iode, car la fraîcheur garde l'accord net. Le dosage n'est cependant qu'un critère : la préparation, la sauce et le profil général de la cuvée comptent aussi.</p>
<h3>Et pour les crustacés cuits ?</h3>
<p>Sur un homard ou des langoustines plus riches, un champagne un peu plus corsé tient bien. Mais pour l'huître crue, restez sur la fraîcheur pure.</p>
<h3>Une sélection strictement Champagne</h3>
<p>Les alternatives hors Champagne sont volontairement séparées afin de ne jamais les présenter comme des champagnes dans le sélecteur.</p>`,
      related:['ruinart','moet'] },

    { id:'anniversaire', cat:'Guide', cover:'linear-gradient(135deg,#F3ECE9,#E9DBD6)', date:'Juillet 2026', read:'5 min',
      title:"Quel champagne pour un anniversaire",
      excerpt:"Marquer le coup selon l'ambiance, la personne et le budget.",
      body:`<p>Un anniversaire appelle un champagne festif, mais le bon choix dépend de l'ambiance et de qui l'on fête. Voici comment viser juste.</p>
<h3>Pour une ambiance conviviale</h3>
<p>Entre amis, misez sur un brut généreux et consensuel qui plaît à tous, comme la <a href="#" onclick="return openAff('clicquot')">Veuve Clicquot Yellow Label</a>. Structuré et reconnaissable, il met tout le monde d'accord.</p>
<h3>Pour une touche festive et gourmande</h3>
<p>Un champagne rosé apporte de la couleur et de la gaieté, parfait pour souffler les bougies. La <a href="#" onclick="return openAff('laurentperrier')">Cuvée Rosé de Laurent-Perrier</a> est fruitée et séduisante.</p>
<h3>Pour un anniversaire qui compte</h3>
<p>Pour un cap important (30, 40, 50 ans), on peut marquer le coup avec une sortie précise comme <a href="#" onclick="return openAff('dom-perignon-vintage-2015')">Dom Pérignon Vintage 2015</a>. Le millésime fait partie du choix et doit toujours apparaître sur la fiche.</p>
<h3>Combien de bouteilles ?</h3>
<p>Comptez une bouteille pour 3 personnes à l'apéritif, davantage si le champagne accompagne le repas. Mieux vaut en avoir un peu trop.</p>`,
      related:['clicquot','laurentperrier','dom-perignon-vintage-2015'] },

    { id:'brut-nature', cat:'Décryptage', cover:'linear-gradient(135deg,#EDEFEA,#E2E6DC)', date:'Juillet 2026', read:'4 min',
      title:"Brut Nature : le champagne des puristes",
      excerpt:"Zéro sucre ajouté, tension pure : le style qui monte, décrypté.",
      body:`<p>Sur les cartes des bars à vins et les tables gastronomiques, une mention revient de plus en plus : « Brut Nature ». Aussi appelé « non dosé » ou « dosage zéro », c'est le champagne dans sa version la plus nue.</p>
<h3>Qu'est-ce que le Brut Nature ?</h3>
<p>Juste avant le bouchage, la plupart des champagnes reçoivent une « liqueur de dosage ». La mention Brut Nature est réservée aux vins dont la teneur en sucre est inférieure à 3 g/L et auxquels aucun sucre n'a été ajouté après la prise de mousse. Le résultat peut paraître plus droit et tendu, selon la cuvée.</p>
<h3>Pour qui ?</h3>
<p>Ce style s'adresse surtout aux amateurs de vins peu dosés et de sensations vives. Il n'est pas automatiquement supérieur à un brut : l'équilibre dépend du vin, de son élevage et de l'accord recherché.</p>
<h3>Avec quoi le boire ?</h3>
<p>À l'apéritif ou avec des fruits de mer, un champagne peu dosé peut prolonger la fraîcheur de l'accord. Pour une piste concrète proche de ce registre, consultez la fiche du <a href="#" onclick="return openAff('larmandier-bernier-latitude')">Latitude de Larmandier-Bernier</a>, présenté comme extra-brut et non comme Brut Nature.</p>`,
      related:['larmandier-bernier-latitude'] },

    { id:'rose-saignee', cat:'Décryptage', cover:'linear-gradient(135deg,#F3E9E7,#E9D6D2)', date:'Juillet 2026', read:'4 min',
      title:"Rosé de saignée ou rosé d'assemblage ?",
      excerpt:"Deux méthodes, deux styles de champagne rosé. On vous explique.",
      body:`<p>Tous les champagnes rosés ne se ressemblent pas, et pour cause : il existe deux façons très différentes de les élaborer. Voici comment les distinguer, et laquelle choisir.</p>
<h3>Le rosé d'assemblage</h3>
<p>La méthode la plus courante en Champagne, et une exception dans le monde du vin : on ajoute du <strong>vin rouge</strong> tranquille à l'assemblage avant la prise de mousse. Le style dépend ensuite des raisins et de la vinification. Le <a href="#" onclick="return openAff('billecart-salmon-brut-rose')">Brut Rosé de Billecart-Salmon</a> en donne un exemple.</p>
<h3>Le rosé de saignée</h3>
<p>Ici, on laisse macérer les raisins noirs pour que le jus se colore avant de séparer le jus des peaux. La <a href="#" onclick="return openAff('laurentperrier')">Cuvée Rosé de Laurent-Perrier</a>, élaborée par macération, illustre cette famille. L'intensité finale dépend toutefois de chaque cuvée.</p>
<h3>Lequel choisir ?</h3>
<p>Pour l'apéritif ou un dessert aux fruits rouges, un rosé d'assemblage tout en finesse. Pour accompagner un plat, un rosé de saignée qui a du corps.</p>`,
      related:['billecart-salmon-brut-rose','laurentperrier'] },

    { id:'vigneron', cat:'Décryptage', cover:'linear-gradient(135deg,#ECEEE7,#E1E5D8)', date:'Juillet 2026', read:'5 min',
      title:"Champagne de vigneron ou grande maison ?",
      excerpt:"Deux visions du champagne. Comment les reconnaître, et laquelle vous convient.",
      body:`<p>Derrière chaque bouteille se cache un choix : le champagne d'une grande maison ou celui d'un vigneron indépendant. Deux philosophies, repérables sur l'étiquette.</p>
<h3>Le code caché de l'étiquette</h3>
<p>En tout petit sur la contre-étiquette, deux lettres racontent tout. <strong>NM</strong> (Négociant-Manipulant) désigne une maison qui achète des raisins pour élaborer ses cuvées, souvent les grandes marques. <strong>RM</strong> (Récoltant-Manipulant) désigne un vigneron qui fait son champagne à partir de ses propres vignes.</p>
<h3>La grande maison</h3>
<p>Régularité, style constant d'année en année, disponibilité partout. On sait ce qu'on achète, comme avec la <a href="#" onclick="return openAff('bollinger')">Special Cuvée de Bollinger</a>. La valeur sûre.</p>
<h3>Le vigneron indépendant</h3>
<p>Un terroir unique, une signature personnelle, souvent un excellent rapport qualité-prix car il n'y a pas de marketing à financer. Plus confidentiel, parfois plus surprenant.</p>
<h3>Alors, lequel ?</h3>
<p>Pour offrir ou pour une valeur sûre, une grande maison. Pour explorer et se faire plaisir malin, un vigneron. Les deux ont leur place à la cave.</p>`,
      related:['bollinger','feuillatte'] },

    { id:'etiquette', cat:'Pratique', cover:'linear-gradient(135deg,#F0EDE7,#E6E0D6)', date:'Juillet 2026', read:'5 min',
      title:"Comment lire une étiquette de champagne",
      excerpt:"Dosage, cépages, millésime, codes : tout ce que l'étiquette vous dit vraiment.",
      body:`<p>Une étiquette de champagne est pleine d'indices sur ce qui vous attend dans le verre. Apprenez à la décoder en cinq points.</p>
<h3>1. Le dosage</h3>
<p>« Brut », « Extra-Brut », « Demi-Sec »… ce mot indique le niveau de sucre, du plus sec au plus doux. C'est le premier repère de goût.</p>
<h3>2. Les cépages</h3>
<p>« Blanc de Blancs » signifie 100 % chardonnay, frais et fin. « Blanc de Noirs » veut dire raisins noirs, plus vineux. Sans mention, c'est un assemblage classique.</p>
<h3>3. Le millésime</h3>
<p>Une année indiquée (par exemple 2016) signale un champagne <strong>millésimé</strong>, issu d'une seule récolte, plus rare et à garder. Sans année, c'est un « brut sans année », assemblage de plusieurs récoltes pour un style constant.</p>
<h3>4. Le petit code</h3>
<p>Les lettres NM, RM, CM en bas indiquent qui a fait le champagne : grande maison (NM), vigneron (RM) ou coopérative (CM).</p>
<h3>5. La provenance</h3>
<p>Une mention comme « Grand Cru » ou « Premier Cru » renvoie au classement historique des villages d'origine des raisins. Elle renseigne la provenance, mais ne suffit pas à elle seule pour juger une cuvée.</p>`,
      related:['ruinart','clicquot'] },
    { id:'rose', cat:'Guide', cover:'linear-gradient(135deg,#F7E9EE,#EFD9E0)', date:'Août 2026', read:'5 min',
      title:"Champagne rosé : comment bien choisir sa cuvée",
      excerpt:"Fruité, gastronomique ou raffiné : trouver le bon rosé selon le moment.",
      body:`<p>Le champagne rosé n'est pas qu'une question de couleur. Selon sa méthode d'élaboration et son assemblage, il passe de l'apéritif léger au vrai vin de gastronomie. Voici comment choisir.</p>
<h3>Rosé d'assemblage : le fruité accessible</h3>
<p>La plupart des rosés champenois sont obtenus en ajoutant un peu de vin rouge à l'assemblage. Résultat : des cuvées fruitées et festives, parfaites à l'apéritif ou sur des fruits rouges. Le <a href="/champagne/j-charpentier-rose-reserve-brut/">Rosé Réserve de J. Charpentier</a> illustre ce registre gourmand.</p>
<h3>Rosé de saignée : plus vineux, plus gastronomique</h3>
<p>Ici, on laisse macérer les raisins noirs pour colorer le jus. Le rosé gagne en corps et en intensité, idéal à table sur une viande blanche ou un poisson grillé. Le <a href="/champagne/jean-vesselle-rose-de-saignee-friandise-demi-sec/">Rosé de saignée de Jean Vesselle</a> en est un bel exemple.</p>
<h3>Pour offrir ou marquer le coup</h3>
<p>Sur une occasion importante, un rosé de vigneron travaillé comme l'<a href="/champagne/lamiable-eclat-d-etoiles-rose-brut-grand-cru-2014/">Éclat d'Étoiles de Lamiable</a> apporte de la finesse et une vraie signature. Pour comparer, voir notre <a href="/champagne/rose/">sélection de champagnes rosés</a>.</p>
<h3>Notre conseil</h3>
<p>Choisissez d'abord l'usage : apéritif et fruits rouges appellent un rosé d'assemblage fruité ; un repas demande un rosé de saignée plus structuré. Pour un choix guidé selon vos goûts, lancez le <a href="/selecteur/">sélecteur</a>.</p>`,
      related:['j-charpentier-rose-reserve-brut','jean-vesselle-rose-de-saignee-friandise-demi-sec','lamiable-eclat-d-etoiles-rose-brut-grand-cru-2014'] },

    { id:'rapport-qualite-prix', cat:'Sélection', cover:'linear-gradient(135deg,#EDE7DA,#E2D8C4)', date:'Août 2026', read:'5 min',
      title:"Les champagnes au meilleur rapport qualité-prix",
      excerpt:"Bien boire sans se ruiner : où se cache la vraie valeur en Champagne.",
      body:`<p>Le meilleur rapport qualité-prix en Champagne se trouve rarement chez les marques les plus connues, dont une partie du prix paie la notoriété. Voici où chercher.</p>
<h3>Les vignerons, la bonne surprise</h3>
<p>Un vigneron qui vinifie ses propres raisins offre souvent plus de vin pour le prix qu'une grande maison. La <a href="/champagne/maison-labbe-brut-premier-cru-tradition/">cuvée Tradition Premier Cru de Maison Labbé</a> ou le <a href="/champagne/louis-constant-brut/">Brut de Louis Constant</a> se placent sous les 40 € avec un vrai caractère.</p>
<h3>Les cuvées d'entrée des maisons sérieuses</h3>
<p>Certaines maisons proposent une entrée de gamme fiable et régulière, comme le <a href="/champagne/cattier-brut-premier-cru/">Brut Premier Cru de Cattier</a>. On sait ce qu'on achète, sans mauvaise surprise.</p>
<h3>Comment juger la valeur</h3>
<p>Regardez le temps de vieillissement annoncé, la part de vins de réserve et le dosage plutôt que la seule étiquette. À prix égal, une cuvée qui vieillit plus longtemps est souvent plus complexe. Comparez dans notre <a href="/champagne/moins-de-50-euros/">sélection à moins de 50 €</a>, ou laissez-vous guider par le <a href="/selecteur/">sélecteur</a>.</p>`,
      related:['maison-labbe-brut-premier-cru-tradition','louis-constant-brut','cattier-brut-premier-cru'] },

    { id:'saint-valentin', cat:'Guide', cover:'linear-gradient(135deg,#F7E6EC,#EFD3DC)', date:'Août 2026', read:'4 min',
      title:"Quel champagne pour la Saint-Valentin",
      excerpt:"Un rosé séduisant ou un blanc de blancs raffiné pour un dîner à deux.",
      body:`<p>Pour un dîner en tête-à-tête, le champagne joue la carte de l'élégance. Deux directions fonctionnent particulièrement bien.</p>
<h3>Un rosé pour la couleur et le fruit</h3>
<p>Un champagne rosé apporte de la gaieté et se marie aux fruits rouges d'un dessert. Le <a href="/champagne/m-g-heucq-rose-brut-fossile/">Rosé Fossile de M.G. Heucq</a>, expressif et vineux, tient aussi à table.</p>
<h3>Un blanc de blancs pour la finesse</h3>
<p>Si vous préférez la fraîcheur et la délicatesse, un blanc de blancs 100 % chardonnay ouvre le repas tout en légèreté, idéal sur des fruits de mer. Voir notre <a href="/champagne/blanc-de-blancs/">sélection de blancs de blancs</a>.</p>
<h3>Pour marquer le coup</h3>
<p>Une cuvée de prestige comme la <a href="/champagne/perrier-jouet-belle-epoque-2016/">Belle Époque de Perrier-Jouët</a> transforme le dîner en moment d'exception. À réserver aux grandes occasions.</p>
<p>Pas sûr de votre choix ? Le <a href="/selecteur/">sélecteur</a> vous oriente selon le style et le budget.</p>`,
      related:['m-g-heucq-rose-brut-fossile','perrier-jouet-belle-epoque-2016'] },

    { id:'conservation', cat:'Pratique', cover:'linear-gradient(135deg,#EBEDEA,#DEE2DB)', date:'Août 2026', read:'4 min',
      title:"Combien de temps se garde un champagne ?",
      excerpt:"Durée de conservation, bouteille ouverte et bonnes conditions de garde.",
      body:`<p>Un champagne se garde bien plus longtemps qu'on ne le croit, à condition de respecter quelques règles simples.</p>
<h3>Bouteille fermée</h3>
<p>Un brut sans année se conserve 3 à 4 ans après l'achat sans problème, souvent davantage. Un champagne millésimé, plus structuré, peut se garder 10 ans ou plus. Conservez les bouteilles couchées, à l'abri de la lumière, entre 10 et 14 °C, sans variations brutales de température.</p>
<h3>Bouteille ouverte</h3>
<p>Une fois ouverte, une bouteille garde ses bulles 2 à 3 jours au réfrigérateur avec un bouchon hermétique adapté. Les cuvées les plus structurées tiennent mieux que les bruts légers.</p>
<h3>Faut-il faire vieillir ?</h3>
<p>Les cuvées vineuses et millésimées gagnent en complexité avec le temps, comme un <a href="/champagne/drappier-quattuor/">Quattuor de Drappier</a>. Les bruts frais et fruités se boivent plutôt jeunes, sur leur vivacité. Pour décoder ce qu'annonce une bouteille, lisez aussi notre guide sur l'<a href="/blog/etiquette/">étiquette</a>.</p>`,
      related:['drappier-quattuor'] },

    { id:'crus', cat:'Décryptage', cover:'linear-gradient(135deg,#EFEBDD,#E4DCC6)', date:'Août 2026', read:'5 min',
      title:"Grand Cru et Premier Cru : que valent ces mentions ?",
      excerpt:"Ce que disent, et ne disent pas, les classements de villages en Champagne.",
      body:`<p>« Grand Cru » et « Premier Cru » reviennent souvent sur les étiquettes. Voici ce qu'ils signifient vraiment, et ce qu'ils ne garantissent pas.</p>
<h3>Un classement de villages</h3>
<p>En Champagne, le classement porte sur la commune d'origine des raisins, pas sur la cuvée. Dix-sept villages sont classés Grand Cru, une quarantaine en Premier Cru. Une mention Grand Cru indique donc une provenance réputée.</p>
<h3>Ce que ça ne garantit pas</h3>
<p>La mention seule ne suffit pas à juger une bouteille : le travail du producteur, l'assemblage et le vieillissement comptent autant. Un excellent vigneron sur un Premier Cru peut surpasser une cuvée générique de Grand Cru.</p>
<h3>De beaux exemples</h3>
<p>Le <a href="/champagne/sadi-malot-brut-nature-1er-cru/">Brut Nature 1er Cru de Sadi Malot</a> ou la <a href="/champagne/benard-pitois-carte-blanche-premier-cru-brut/">Carte Blanche Premier Cru de Benard Pitois</a> montrent tout l'intérêt d'un terroir bien travaillé. Retenez la mention comme un indice de provenance, pas comme une note de qualité. Pour choisir selon vos critères, utilisez le <a href="/selecteur/">sélecteur</a>.</p>`,
      related:['sadi-malot-brut-nature-1er-cru','benard-pitois-carte-blanche-premier-cru-brut'] },

    { id:'foie-gras', cat:'Accords', cover:'linear-gradient(135deg,#F1EAD9,#E7DCC3)', date:'Août 2026', read:'4 min',
      title:"Quel champagne avec le foie gras ?",
      excerpt:"Structure, dosage, millésime : l'accord idéal pour un classique des fêtes.",
      body:`<p>Le foie gras, riche et fondant, demande un champagne capable de lui tenir tête sans être écrasé. Deux écoles s'affrontent.</p>
<h3>Un champagne vineux et mûr</h3>
<p>L'accord le plus sûr : une cuvée à dominante pinot noir, ample et structurée, éventuellement millésimée. Sa matière répond au gras sans le fatiguer. Un <a href="/champagne/drappier-quattuor/">Quattuor de Drappier</a> ou une cuvée de garde font merveille.</p>
<h3>La piste du demi-sec</h3>
<p>Sur un foie gras poêlé ou accompagné d'un chutney, un champagne légèrement dosé (demi-sec) joue la carte sucré-salé et adoucit la puissance du plat.</p>
<h3>À éviter</h3>
<p>Un brut très sec et léger d'apéritif sera vite dominé. Gardez-le pour l'entrée en matière et montez en corps sur le foie gras. Pour d'autres idées, voir notre <a href="/blog/accords/">guide des accords mets et champagne</a>.</p>`,
      related:['drappier-quattuor'] },

/* ====================== SCORING ====================== */
function budgetFitScore(p, budget){
  const min=Number.isFinite(p.priceMin) ? p.priceMin : p.price;
  const max=Number.isFinite(p.priceMax) ? p.priceMax : p.price;
  if(budget==='b4') return min>=100 ? 34 : min>=80 ? 25 : min>=60 ? 12 : 3;
  const ranges={b1:[0,40],b2:[40,60],b3:[60,100]};
  const range=ranges[budget]||ranges.b2, lower=range[0], upper=range[1];
  const overlaps=max>=lower && min<=upper;
  if(overlaps) return min>=lower && max<=upper ? 34 : 29;
  if(min>upper){
    const over=min-upper;
    return over<=5 ? 20 : over<=12 ? 8 : 0;
  }
  const under=lower-max;
  return under<=10 ? 20 : under<=25 ? 8 : 0;
}
function signalFit(p, signal){
  if(!signal || signal==='any') return true;
  if(signal==='maison') return p.producerType==='maison';
  if(signal==='vigneron') return p.producerType==='vigneron';
  if(signal==='low_dosage') return p.tags.includes('Extra-brut / nature') || /\b(?:0|1|2|3|4|5|6)(?:[,.]\d+)?\s*g\/L\b/i.test(p.details?.dosage||'');
  return true;
}
function accordFit(p, accord){
  if(!accord || accord==='accord_any') return true;
  return (p.accords||[]).includes(accord);
}
function destinataireScore(p, dest){
  if(!dest || dest==='dest_any') return 10;
  if(dest==='dest_connaisseur'){
    let s=2;
    if(p.producerType==='vigneron') s+=12;
    if(p.tags.includes('Extra-brut / nature')) s+=5;
    if(p.tags.includes('Grand Cru')||p.tags.includes('Premier Cru')) s+=4;
    if((p.details?.scores?.complexity||3)>=4) s+=3;
    return Math.min(22,s);
  }
  if(dest==='dest_novice'){
    let s=2;
    if(p.producerType==='maison') s+=10;
    if((p.popularity||0)>=80) s+=6;
    if(p.tags.includes('Brut') && !p.tags.includes('Extra-brut / nature')) s+=4;
    return Math.min(22,s);
  }
  if(dest==='dest_prestige'){
    let s=2;
    if((p.tier||1)>=3) s+=10;
    if(p.tags.includes('Millésimé')) s+=5;
    if(p.tags.includes('Grand Cru')) s+=4;
    if((p.popularity||0)>=84) s+=3;
    return Math.min(22,s);
  }
  return 10;
}
function convivesScore(p, crowd){
  if(!crowd || crowd==='crowd_any') return 10;
  if(crowd==='crowd_valeur'){
    let s=2;
    if(p.producerType==='maison') s+=10;
    if((p.popularity||0)>=80) s+=6;
    if(p.tags.includes('Brut') && !p.tags.includes('Extra-brut / nature')) s+=4;
    return Math.min(22,s);
  }
  if(crowd==='crowd_decouverte'){
    let s=2;
    if(p.producerType==='vigneron') s+=12;
    if(p.tags.includes('Grand Cru')||p.tags.includes('Premier Cru')) s+=4;
    if((p.details?.scores?.complexity||3)>=4) s+=3;
    return Math.min(22,s);
  }
  if(crowd==='crowd_festif'){
    let s=2;
    if((p.details?.scores?.freshness||3)>=4) s+=8;
    if((p.tier||1)<=2) s+=6;
    if(p.profil.includes('profil_fruite')||p.profil.includes('profil_frais_vif')) s+=4;
    return Math.min(22,s);
  }
  return 10;
}
function aperitifScore(p, val){
  if(!val || val==='apero_any') return 10;
  const sc=p.details?.scores||{};
  if(val==='apero_leger'){ let s=2; if((sc.freshness||3)>=4) s+=8; if(p.profil.includes('profil_frais_vif')||p.profil.includes('profil_delicat')) s+=5; if(p.tags.includes('Blanc de blancs')) s+=3; return Math.min(22,s); }
  if(val==='apero_dinatoire'){ let s=2; if(p.tags.includes('Brut') && !p.tags.includes('Extra-brut / nature')) s+=5; if((sc.roundness||3)>=3) s+=5; if(p.profil.includes('profil_fruite')||p.profil.includes('profil_riche_ample')) s+=5; return Math.min(22,s); }
  if(val==='apero_trinquer'){ let s=2; if((p.popularity||0)>=80) s+=6; if(p.profil.includes('profil_fruite')) s+=6; if((p.tier||1)<=2) s+=5; return Math.min(22,s); }
  return 10;
}
function deuxScore(p, val){
  if(!val || val==='duo_any') return 10;
  const sc=p.details?.scores||{};
  if(val==='duo_apero'){ let s=2; if((sc.freshness||3)>=4) s+=8; if(p.profil.includes('profil_delicat')||p.profil.includes('profil_frais_vif')) s+=5; if(p.tags.includes('Blanc de blancs')) s+=3; return Math.min(22,s); }
  if(val==='duo_diner'){ let s=2; if((sc.complexity||3)>=4) s+=8; if(p.profil.includes('profil_riche_ample')) s+=5; if((p.tier||1)>=2) s+=3; if(p.producerType==='vigneron') s+=2; return Math.min(22,s); }
  if(val==='duo_celebration'){ let s=2; if(p.tags.includes('Rosé')) s+=6; if((p.tier||1)>=3) s+=6; if(p.tags.includes('Millésimé')) s+=4; return Math.min(22,s); }
  if(val==='duo_verre'){ let s=2; if(p.profil.includes('profil_fruite')||p.profil.includes('profil_delicat')) s+=7; if((sc.roundness||3)>=3) s+=5; if((p.tier||1)<=2) s+=4; return Math.min(22,s); }
  return 10;
}
function intentScore(p, a){
  const occ=(a.occasion||[]);
  if(occ.includes('occ_cadeau')) return destinataireScore(p,(a.destinataire||[])[0]);
  if(occ.includes('occ_fete')) return convivesScore(p,(a.convives||[])[0]);
  if(occ.includes('occ_apero')) return aperitifScore(p,(a.apero||[])[0]);
  if(occ.includes('occ_romantique')) return deuxScore(p,(a.duo||[])[0]);
  const accord=(a.accord||[])[0];
  return accord==='accord_any' ? 10 : accordFit(p,accord) ? 22 : 2;
}
function evidenceScore(p){
  if(p.officialSourceUrl && /^official_confirmed/.test(p.identityStatus||'')) return 6;
  if(p.officialSourceUrl) return 4;
  return 1;
}
function scoreBreakdown(p,a){
  const occ=(a.occasion||[])[0], gout=(a.gout||[])[0], accord=(a.accord||[])[0];
  const budget=(a.budget||[])[0], signal=(a.repere||[])[0];
  const intent = intentScore(p,a);
  return {
    budget:budgetFitScore(p,budget),
    style:gout==='profil_any' ? 12 : p.profil.includes(gout) ? 27 : 3,
    occasion:p.occ.includes(occ) ? 21 : 2,
    accord:intent,
    signature:signal==='any' ? 8 : signalFit(p,signal) ? 17 : 0,
    availability:p.commerceReady===true && p.availability==='in_stock' ? 10 : 0,
    evidence:evidenceScore(p)
  };
}
function score(p, a){
  return Object.values(scoreBreakdown(p,a)).reduce((sum,value)=>sum+value,0);
}
function ranked(){
  const eligible=products().filter(p=>p.commerceReady===true && p.availability==='in_stock');
  const sc=eligible.map(p=>({p,s:score(p,state.answers),breakdown:scoreBreakdown(p,state.answers)}));
  sc.sort((a,b)=>b.s-a.s || (b.p.popularity||0)-(a.p.popularity||0) || a.p.id.localeCompare(b.p.id,'fr'));
  return sc;
}

/* Aucune photographie distante n'est publiée sans registre de droits.
   Une composition éditoriale remplace le packshot tant qu'une image validée
   n'est pas associée explicitement à une fiche. */
const PHOTOS = {};
function photoSrc(u, w){
  if(u.startsWith('/')) return u;
  return u.includes('?') ? u : u + '?auto=format&fit=crop&w=' + (w||600) + '&q=72';
}
function editorialVisual(p, mode){
  const kind=p.producerType==='vigneron'?'Vigneron':'Maison';
  const meta=(p.tags||[]).slice(0,2).join(' · ');
  const initials=p.house.split(/\s+/).map(word=>word[0]).join('').slice(0,3).toUpperCase();
  const text=`${p.name} ${(p.tags||[]).join(' ')}`.toLowerCase();
  const palette=text.includes('rosé')
    ? ['#6E343B','#783F46','#63343F']
    : text.includes('blanc de blancs')
      ? ['#34433F','#3C4433','#2E4247']
      : p.producerType==='vigneron'
        ? ['#34412D','#473B2D','#29423B']
        : ['#233B34','#27364A','#40352D','#3E2934'];
  const paletteIndex=[...p.id].reduce((sum,char)=>sum+char.charCodeAt(0),0)%palette.length;
  const deep=palette[paletteIndex];
  const accent=p.accent||'#b89243';
  if(mode==='mini') return `<div class="editorial-visual visual-mini" style="--v-deep:${deep};--v-accent:${accent}" role="img" aria-label="${p.house} ${p.short}"><span class="visual-initials">${initials}</span></div>`;
  return `<div class="editorial-visual visual-${mode}" style="--v-deep:${deep};--v-accent:${accent}" role="img" aria-label="Présentation éditoriale de ${p.house} ${p.short}">
    <div class="visual-top"><span class="visual-kind">${kind}</span><span class="visual-region">Champagne</span></div>
    <div class="visual-copy"><div class="visual-house">${p.house}</div><div class="visual-cuvee">${p.short}</div><div class="visual-meta">${meta}</div></div>
  </div>`;
}
function bottleViz(p, mode){
  const img = p.image || PHOTOS[p.id];
  if(img) return `<img class="pimg product-packshot" src="${photoSrc(img, mode==='mini'?200:600)}" alt="Bouteille ${p.house} ${p.short}" loading="lazy">`;
  return editorialVisual(p, mode);
}

function styleWords(p, prefer){
  const label={profil_frais_vif:"une bouche fraîche et tendue, sur les agrumes et une finale nette",
    profil_riche_ample:"une matière ample et vineuse, aux notes briochées",
    profil_delicat:"une expression fine et florale, tout en légèreté",
    profil_fruite:"un fruité mûr et une rondeur souple"};
  const order=[]; if(prefer && p.profil.includes(prefer)) order.push(prefer);
  for(const t of ['profil_frais_vif','profil_riche_ample','profil_delicat','profil_fruite']) if(!order.includes(t)) order.push(t);
  for(const t of order){ if(p.profil.includes(t)) return label[t]; }
  return "un profil équilibré et polyvalent";
}
function occasionReason(p, tag){
  const frais = p.profil.includes('profil_frais_vif') || p.profil.includes('profil_delicat');
  const ample = p.profil.includes('profil_riche_ample');
  if(tag==='occ_apero') return frais ? "Fraîche et lisible, elle ouvre le repas sans couvrir les premières bouchées." : "Son équilibre en fait un apéritif facile, qui plaît sans dominer.";
  if(tag==='occ_diner') return ample ? "Sa matière lui permet de tenir tête à un plat sans s’effacer." : "Assez structurée pour passer à table, elle accompagne le plat principal.";
  if(tag==='occ_fete') return "Un style accessible qui rassemble un large public tout en gardant du caractère.";
  if(tag==='occ_cadeau') return `Son identité (${p.house}, ${p.tags.slice(0,2).join(' · ').toLowerCase()}) en fait une bouteille à offrir.`;
  if(tag==='occ_romantique') return "Fine et précise, elle se déguste lentement, à deux.";
  return null;
}
/* Une seule raison "intention", propre à la branche suivie (accord, destinataire,
   convives, apéritif, moment à deux). Renvoie null si rien de spécifique. */
function intentReason(p, a){
  const occ=(a.occasion||[]);
  if(occ.includes('occ_cadeau')){
    const dest=(a.destinataire||[])[0];
    if(dest==='dest_connaisseur') return `Cuvée ${p.producerType==='vigneron'?'de vigneron':'de caractère'}${p.tags.includes('Grand Cru')?' en grand cru':''}, elle a de quoi séduire un connaisseur.`;
    if(dest==='dest_novice') return `Signée ${p.house}, c’est une valeur sûre, lisible et facile à aimer.`;
    if(dest==='dest_prestige') return `Son standing (${priceText(p)}${p.tags.includes('Millésimé')?', millésimé':''}) en fait un cadeau qui marque.`;
    return null;
  }
  if(occ.includes('occ_fete')){
    const crowd=(a.convives||[])[0];
    if(crowd==='crowd_valeur') return `Un style consensuel signé ${p.house}, qui met tout le monde d’accord.`;
    if(crowd==='crowd_decouverte') return `${p.producerType==='vigneron'?'Champagne de vigneron':'Cuvée originale'}, de quoi faire découvrir quelque chose à vos invités.`;
    if(crowd==='crowd_festif') return `Fraîche et facile à partager, elle garde la soirée festive sans prise de tête.`;
    return null;
  }
  if(occ.includes('occ_apero')){
    const ap=(a.apero||[])[0];
    if(ap==='apero_leger') return `Fraîche et précise, elle ouvre l’appétit sans alourdir l’apéritif.`;
    if(ap==='apero_dinatoire') return `Assez polyvalente pour tenir sur des planches et un apéritif dînatoire.`;
    if(ap==='apero_trinquer') return `Facile et conviviale, parfaite pour simplement trinquer.`;
    return null;
  }
  if(occ.includes('occ_romantique')){
    const duo=(a.duo||[])[0];
    if(duo==='duo_apero') return `Fraîche et fine, idéale pour un apéritif à deux.`;
    if(duo==='duo_diner') return `Sa matière l’accorde à un dîner gastronomique à deux.`;
    if(duo==='duo_celebration') return `Une bouteille${p.tags.includes('Rosé')?' rosée':''} marquante pour fêter l’instant.`;
    if(duo==='duo_verre') return `Tout en rondeur, elle se savoure tranquillement, juste un verre à deux.`;
    return null;
  }
  const accord=(a.accord||[])[0];
  if(accordFit(p,accord) && accord && accord!=='accord_any' && p.pair) return `Ses accords de prédilection (${p.pair}) tombent juste sur ce que vous servez.`;
  return null;
}
function matchReasons(p){
  const reasons=[];
  const a=state.answers;
  const occ=(a.occasion||[]);
  // Lead : la raison d'intention propre à la branche, sinon le contexte d'occasion.
  const intent=intentReason(p,a);
  if(intent) reasons.push(intent);
  else { const occTag=occ.find(tag=>p.occ.includes(tag)); if(occTag){ const r=occasionReason(p,occTag); if(r) reasons.push(r); } }
  const goutMatch=(a.gout||[]).find(tag=>p.profil.includes(tag));
  if(goutMatch) reasons.push(`Côté goût, on retrouve ${styleWords(p,goutMatch)} : exactement la sensation recherchée.`);
  const budget=(a.budget||[])[0];
  if(budget && budgetFitScore(p,budget)>=29) reasons.push(`À ${priceText(p)}, elle se place précisément dans la tranche que vous avez fixée.`);
  // Signature : on évite de répéter maison/vigneron si la branche cadeau ou convives l'a déjà dit.
  const signal=(a.repere||[])[0];
  const producerCovered=occ.includes('occ_cadeau')||occ.includes('occ_fete');
  if(signalFit(p,signal)){
    if(signal==='maison' && !producerCovered) reasons.push(`Signée ${p.house}, c’est une maison lisible et rassurante.`);
    if(signal==='vigneron' && !producerCovered) reasons.push("C’est un champagne de vigneron, plus personnel, comme vous le souhaitiez.");
    if(signal==='low_dosage') reasons.push("Son dosage très bas (extra-brut ou brut nature) répond à votre goût pour les cuvées très sèches.");
  }
  if(reasons.length<2) reasons.push("Au global, c’est la bouteille la plus cohérente avec l’ensemble de vos réponses.");
  return reasons.slice(0,4);
}

function selectedCriteria(){
  const labels={};
  questions().forEach(question=>question.opts.forEach(option=>{labels[option.tags[0]]=option.l;}));
  return ['occasion','accord','gout','budget','repere']
    .map(key=>(state.answers[key]||[])[0])
    .filter(Boolean)
    .map(value=>`<span>${labels[value]||value}</span>`)
    .join('');
}

function alternativeReason(candidate,top){
  const p=candidate.p;
  if(p.price < top.p.price-5) return `Une option plus accessible, à ${priceText(p)}.`;
  if(p.producerType!==top.p.producerType) return p.producerType==='vigneron' ? "Une alternative de vigneron, plus tournée vers la découverte." : "Une alternative issue d’une maison établie.";
  const style=(state.answers.gout||[])[0];
  if(style!=='profil_any' && p.profil.includes(style)) return "Le même registre de goût, avec une autre expression.";
  return "Une bouteille proche par son usage et sa tranche de prix.";
}

function renderResult(){
  const r=ranked(), top=r[0], tp=top.p, alts=r.slice(1,4);

        <p class="rnote">${tp.note}</p>
        <div class="why"><strong>Pourquoi nous la retenons</strong><ul class="why-list">${reasons}</ul></div>
        <div class="rtags">${pills}</div>
        <div class="rbuy">
          <div class="rprice">${priceText(tp)}</div>
          <a class="btn btn-accent" href="/champagne/${tp.id}/">Voir l’analyse</a>
        </div>
        <div class="aff-note">${tp.commerceReady ? `Prix relevé chez notre partenaire · l’offre se trouve sur la fiche.` : `Offre momentanément indisponible.`}</div>
      </div>
    </div>
    <div class="alts-head">Trois alternatives à comparer</div>
    <div class="alts">${altc}</div>
    <div class="res-again"><button class="btn btn-ghost" onclick="startQuiz()">Refaire le test</button></div>
  </div></section>` + foot();
}

    ${(d.advice||d.dego)?`<div class="pblock alt"><div class="pblock-eyebrow">Notre conseil</div><h2 class="pblock-h">Pourquoi la choisir</h2><p class="pblock-p">${d.advice||d.dego}</p></div>`:''}

    <div class="pblock alt"><div class="pblock-eyebrow">Décision rapide</div><h2 class="pblock-h">Est-ce la bonne cuvée pour vous ?</h2><div class="decision-grid"><div class="decision"><strong>À choisir si…</strong><p>${guide.choose}</p></div><div class="decision"><strong>À éviter si…</strong><p>${guide.avoid}</p></div></div></div>

    ${d.facts?`<div class="pblock"><div class="pblock-eyebrow">Fait vérifié</div><h2 class="pblock-h">Ce qu'il faut retenir</h2><p class="pblock-p">${d.facts}</p><p class="aff-note" style="text-align:center">Source contrôlée le ${p.verifiedAt||'-'}.</p></div>`:''}

    ${d.dosage?`<div class="pblock"><div class="pblock-eyebrow">Assemblage & terroir</div><h2 class="pblock-h">La composition</h2>
      <div class="compo">
        <div class="compo-i"><div class="compo-v">${d.dosage}</div><div class="compo-l">Dosage</div></div>
        <div class="compo-i"><div class="compo-v">${d.cepages}</div><div class="compo-l">Cépages</div></div>
      </div>

    ${d.accords?`<div class="pblock alt"><div class="pblock-eyebrow">À table</div><h2 class="pblock-h">Accords conseillés</h2><div class="accs">${accords}</div></div>`:''}

    ${d.maison?`<div class="pblock"><div class="pblock-eyebrow">La maison</div><h2 class="pblock-h">${p.house}</h2><p class="pblock-p">${d.maison}</p></div>`:''}

/* ====================== ACTIONS ====================== */
function render(){
  ({home:renderHome, quiz:renderQuiz, result:renderResult, blog:renderBlog, article:renderArticle, shop:renderShop, product:renderProduct}[state.view])();
  const mainTarget=document.querySelector('#app section');
  if(mainTarget && !document.getElementById('main-content')) mainTarget.id='main-content';
  window.scrollTo({top:0, behavior:'smooth'});
}
function openProduct(id){ state.product=id; state.view='product'; render(); }
function go(v){ state.view=v; render(); }
function startQuiz(){ state.view='quiz'; state.step=0; state.answers={}; state.quizStartedTracked=false; state.resultTrackedFor=null; state.animKey++; render(); }
function answer(qid,tags){ state.answers[qid]=tags; if(window.qcTrack)window.qcTrack('quiz_answered',{source:qid,step:state.step+1}); if(state.step>=questions().length-1){ state.view='result'; } else { state.step++; state.animKey++; } render(); }
function qBack(){ if(state.step===0){ state.view='home'; } else { state.step--; state.animKey++; } render(); }
function openArticle(id){ state.article=id; state.view='article'; render(); }
function openAff(id){ const p=prod(id); const link=p&&(buyLink(p)||p.sourceUrl); if(link) window.open(link,'_blank','noopener'); return false; }
function track(id){ /* point d'accroche tracking d'affiliation (ex : ?ref=quelchampagne) */ }

/* Charge le catalogue live (catalogue.json) si présent ; sinon sélection intégrée. */
async function loadCatalogue(){
  try{
    const r = await fetch('/catalogue.json', {cache:'no-store'});
    if(!r.ok) return;
    const data = await r.json();
    if(Array.isArray(data) && data.length){
      CATALOGUE = data.map(p => ({
        glass:['#243c2e','#4a6a54'], foil:'#c9a85e', cork:'#7c5c3a', accent:'#9C7A34',
        tags:[], occ:[], profil:[], accords:[], bulles:'bulles_fines', tier:2,
        short: p.short || p.name, region: p.region || 'Champagne', ...p,
      }));
      render();
    }
  }catch(e){ /* repli silencieux */ }
}

/* Porte d'âge volontaire. */
function ageGate(){
  try{ if(localStorage.getItem('qc_age_ok')==='1') return; }catch(e){}
  const el = document.createElement('div');
  el.className = 'agegate'; el.id = 'agegate';
  el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true'); el.setAttribute('aria-labelledby','agegate-title');
  el.innerHTML = `
    <div class="agegate-box">
      <div class="g"></div>
      <h2 id="agegate-title">Vous avez 18 ans ou plus ?</h2>
      <p>${BRAND} est un site d'information sur le champagne, réservé aux personnes majeures.</p>
      <div class="btns">
        <button type="button" class="btn btn-primary" onclick="ageOK()">Oui, j'ai 18 ans ou plus</button>
        <button type="button" class="btn btn-ghost" onclick="ageNo()">Non</button>
      </div>
      <div class="health">L'abus d'alcool est dangereux pour la santé. À consommer avec modération.</div>
      <small>En entrant, vous confirmez être majeur selon la législation de votre pays.</small>
    </div>`;
  document.body.appendChild(el);
  document.body.style.overflow='hidden';
  const controls=[...el.querySelectorAll('button')];
  if(controls[0]) controls[0].focus();
  el.addEventListener('keydown',event=>{
    if(event.key!=='Tab'||controls.length<2) return;
    if(event.shiftKey&&document.activeElement===controls[0]){event.preventDefault();controls[controls.length-1].focus();}
    else if(!event.shiftKey&&document.activeElement===controls[controls.length-1]){event.preventDefault();controls[0].focus();}
  });
}
function ageOK(){ try{ localStorage.setItem('qc_age_ok','1'); }catch(e){} const el=document.getElementById('agegate'); if(el) el.remove(); document.body.style.overflow=''; }
function ageNo(){ const el=document.getElementById('agegate'); if(el) el.querySelector('.agegate-box').innerHTML = `<div class="g"></div><h2>À bientôt</h2><p>Ce site est réservé aux personnes majeures. Nous ne pouvons pas vous donner accès au contenu.</p><div class="health">L'abus d'alcool est dangereux pour la santé. À consommer avec modération.</div>`; }

render();
loadCatalogue();
ageGate();
</script>
