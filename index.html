<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuelChampagne — Trouvez le champagne fait pour vous</title>
<meta name="description" content="Le sélecteur indépendant qui vous oriente vers la cuvée juste en quatre questions, à partir de fiches vérifiées.">
<meta property="og:type" content="website">
<meta property="og:title" content="QuelChampagne — Trouvez le champagne fait pour vous">
<meta property="og:description" content="Quatre questions, une recommandation sur mesure et des fiches reliées à leurs sources.">
<meta property="og:url" content="https://quelchampagne.fr">
<meta property="og:image" content="https://quelchampagne.fr/assets/og-quelchampagne.png">
<meta property="og:locale" content="fr_FR">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#ffffff">
<link rel="canonical" href="https://quelchampagne.fr">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M8.4 5H15.6L14.2 12.3A2.7 2.7 0 0 1 9.8 12.3Z' fill='%23F3E7C9' stroke='%239C7A34' stroke-width='1.2'/%3E%3Cline x1='12' y1='15' x2='12' y2='20.2' stroke='%239C7A34' stroke-width='1.3'/%3E%3Cline x1='9' y1='20.6' x2='15' y2='20.6' stroke='%239C7A34' stroke-width='1.3'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#FFFFFF; --bg2:#F5F5F7; --ink:#1D1D1F; --muted:#6E6E73; --faint:#86868B;
  --border:#D2D2D7; --line:#E8E8ED;
  --accent:#9C7A34; --accent-deep:#7E621F;
  --sans:-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0}
html{scroll-behavior:smooth; -webkit-text-size-adjust:100%}
body{font-family:var(--sans); color:var(--ink); background:var(--bg); line-height:1.5; -webkit-font-smoothing:antialiased; letter-spacing:-.01em}
::selection{background:#E7DABD}
a{color:inherit; text-decoration:none}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
img{max-width:100%; display:block}
.skip-link{position:fixed; left:16px; top:10px; z-index:300; padding:10px 14px; border-radius:10px; background:var(--ink); color:#fff; transform:translateY(-150%); transition:transform .2s}
.skip-link:focus{transform:none}
:focus-visible{outline:3px solid #C99A1E; outline-offset:3px}
.container{max-width:1000px; margin:0 auto; padding:0 26px}
.narrow{max-width:700px; margin:0 auto; padding:0 26px}

.btn{display:inline-flex; align-items:center; gap:6px; font-size:16px; font-weight:400; padding:11px 22px; border-radius:980px; transition:background .2s, transform .2s, opacity .2s; white-space:nowrap}
.btn-primary{background:var(--ink); color:#fff}
.btn-primary:hover{opacity:.86}
.btn-accent{background:var(--accent); color:#fff}
.btn-accent:hover{background:var(--accent-deep)}
.btn-ghost{background:var(--bg2); color:var(--ink)}
.btn-ghost:hover{background:#ececef}
.btn-sm{font-size:14px; padding:8px 16px}
.chev{color:var(--accent-deep); font-size:16px; font-weight:400; display:inline-flex; align-items:center; gap:3px}
.chev:hover{text-decoration:underline; text-underline-offset:3px}
.chev::after{content:"›"; font-size:18px; line-height:1; transition:transform .2s}
.chev:hover::after{transform:translateX(3px)}

.nav{position:sticky; top:0; z-index:50; background:rgba(255,255,255,.72); backdrop-filter:saturate(180%) blur(20px); border-bottom:1px solid var(--line)}
.nav-in{display:flex; align-items:center; justify-content:space-between; height:52px}
.logo{display:flex; align-items:center; gap:8px; font-size:19px; font-weight:600; letter-spacing:-.02em; cursor:pointer}
.logo .g{width:15px; height:15px; border-radius:50%; background:linear-gradient(150deg,#E7D3A0,#9C7A34)}
.logo-txt{font-weight:450}
.logo-txt b{font-weight:600}
.foot-brand-name{display:inline-flex; align-items:center; gap:8px}
.nav-links{display:flex; align-items:center; gap:28px}
.nlink{font-size:14px; font-weight:400; color:var(--muted); transition:.18s}
.nlink:hover,.nlink.on{color:var(--ink)}

.hero{text-align:center; padding:clamp(64px,10vw,116px) 0 clamp(20px,4vw,44px)}
h1{font-size:clamp(42px,7vw,80px); font-weight:600; line-height:1.04; letter-spacing:-.035em}
.hero .lead{font-size:clamp(19px,2.3vw,26px); font-weight:400; color:var(--muted); max-width:24ch; margin:22px auto 0; line-height:1.32; letter-spacing:-.015em}
.hero-cta{margin-top:32px; display:flex; gap:22px; justify-content:center; align-items:center; flex-wrap:wrap}
.hero-visual{margin:clamp(28px,4vw,52px) auto 0; width:100%; max-width:620px; height:clamp(240px,34vw,380px); border-radius:26px; overflow:hidden; box-shadow:0 40px 60px -34px rgba(29,29,31,.4)}
.hero-visual svg{height:100%; width:auto; margin:0 auto; display:block; filter:drop-shadow(0 40px 50px rgba(29,29,31,.22))}
.hero-visual .pimg{width:100%; height:100%}
.pimg{width:100%; height:100%; object-fit:cover; display:block}
.trust-strip{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; max-width:850px; margin:34px auto 0; overflow:hidden; border:1px solid var(--line); border-radius:20px; background:var(--line)}
.trust-item{padding:18px; background:var(--bg); text-align:left}
.trust-item strong{display:block; font-size:15px}
.trust-item span{display:block; margin-top:4px; color:var(--muted); font-size:13px; line-height:1.4}

/* ===== Refonte festive : hero photo, bulles, animations ===== */
.hero-photo{position:relative; overflow:hidden; text-align:center; color:#fff; padding:clamp(104px,15vw,180px) 0 clamp(84px,11vw,132px); display:flex; align-items:center; min-height:clamp(540px,74vh,780px)}
.hero-photo::before{content:""; position:absolute; inset:0; background-image:var(--hero-img); background-size:cover; background-position:center; z-index:0; animation:heroZoom 20s ease-out forwards}
.hero-photo::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(24,18,8,.58) 0%, rgba(24,18,8,.40) 38%, rgba(24,18,8,.74) 100%); z-index:1}
.hero-photo .container{position:relative; z-index:3; width:100%}
@keyframes heroZoom{from{transform:scale(1.16)}to{transform:scale(1.03)}}
.hero-photo h1{color:#fff; text-shadow:0 2px 34px rgba(0,0,0,.4)}
.hero-photo .lead{font-size:clamp(19px,2.3vw,27px); font-weight:400; color:rgba(255,255,255,.92); max-width:26ch; margin:22px auto 0; line-height:1.32; letter-spacing:-.015em; text-shadow:0 1px 18px rgba(0,0,0,.35)}
.hero-photo .hero-cta{margin-top:36px; display:flex; gap:22px; justify-content:center; align-items:center; flex-wrap:wrap}
.hero-photo .chev{color:#fff}
.btn-lg{padding:16px 30px; font-size:16px; border-radius:999px}
/* bulles de champagne */
.bubbles{position:absolute; inset:0; z-index:2; overflow:hidden; pointer-events:none}
.bubbles i{position:absolute; bottom:-40px; border-radius:50%; background:radial-gradient(circle at 32% 30%, rgba(255,255,255,.95), rgba(255,238,196,.4) 58%, rgba(255,238,196,0) 72%); opacity:0; animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) scale(.5); opacity:0}12%{opacity:.9}88%{opacity:.6}100%{transform:translateY(-104vh) scale(1); opacity:0}}
/* CTA quiz dans la nav */
.nlink-cta{display:inline-flex; align-items:center; gap:7px; padding:0; border:0; background:none; color:var(--ink); font-family:inherit; font-size:14px; font-weight:500; cursor:pointer; line-height:1; letter-spacing:-.01em; transition:color .18s}
.nlink-cta:hover{color:var(--accent-deep)}
.nlink-cta svg{flex:none; margin-top:-1px}
.btn-lg{border-radius:12px}
/* en-tête de page illustrée (sélection) */
.page-hero{position:relative; overflow:hidden; color:#fff; padding:clamp(60px,9vw,110px) 0 clamp(42px,6vw,74px); margin-bottom:clamp(18px,3vw,32px)}
.page-hero::before{content:""; position:absolute; inset:0; background-image:var(--ph-img); background-size:cover; background-position:center; z-index:0}
.page-hero::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(18,13,5,.68) 0%, rgba(18,13,5,.72) 45%, rgba(18,13,5,.86) 100%); z-index:1}
.page-hero .container{position:relative; z-index:2}
.page-hero h1{color:#fff; text-shadow:0 2px 26px rgba(0,0,0,.55)}
.page-hero p{color:rgba(255,255,255,.94) !important; text-shadow:0 1px 16px rgba(0,0,0,.5)}
.page-hero .tag{background:rgba(255,255,255,.16); color:#fff}
.page-hero .tag:hover{background:rgba(255,255,255,.30)}
/* apparitions au scroll */
.reveal{opacity:0; transform:translateY(28px); transition:opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1; transform:none}
.btn{transition:transform .18s, opacity .18s, background .18s, box-shadow .18s}
.btn-primary:hover,.btn-accent:hover{transform:translateY(-1px)}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1 !important; transform:none !important}.hero-photo::before{animation:none}.bubbles{display:none}}

.section{padding:clamp(64px,9vw,116px) 0}
.section.gray{background:var(--bg2)}
.sec-head{text-align:center; max-width:640px; margin:0 auto clamp(40px,5vw,64px)}
.h2{font-size:clamp(30px,4.4vw,52px); font-weight:600; letter-spacing:-.03em; line-height:1.07}
.sec-head p{font-size:clamp(17px,2vw,22px); color:var(--muted); margin-top:16px; font-weight:400; letter-spacing:-.015em; line-height:1.4}

.steps{display:grid; grid-template-columns:repeat(3,1fr); gap:22px}
.step{background:var(--bg); border-radius:24px; padding:40px 32px; text-align:left}
.section:not(.gray) .step{background:var(--bg2)}
.step .n{font-size:15px; font-weight:600; color:var(--accent)}
.step h3{font-size:23px; font-weight:600; letter-spacing:-.02em; margin-top:18px}
.step p{color:var(--muted); font-size:16px; margin-top:10px; line-height:1.45; font-weight:400}

.maisons{display:flex; flex-wrap:wrap; justify-content:center; gap:14px 40px; max-width:760px; margin:0 auto}
.maison-name{font-size:clamp(18px,2.2vw,24px); font-weight:500; color:var(--faint); letter-spacing:-.01em; transition:.2s}
.maison-name:hover{color:var(--ink)}

.cards{display:grid; grid-template-columns:repeat(3,1fr); gap:24px}
.acard{border-radius:22px; overflow:hidden; background:var(--bg); cursor:pointer; transition:transform .25s; display:flex; flex-direction:column; box-shadow:0 2px 10px rgba(29,29,31,.04)}
.section.gray .acard{box-shadow:0 4px 20px rgba(29,29,31,.06)}
.acard:hover{transform:translateY(-5px)}
.acard.soon{cursor:default; opacity:.6}
.acard.soon:hover{transform:none}
.acard-cover{height:158px; position:relative}
.acard-cat{position:absolute; top:14px; left:14px; font-size:12.5px; font-weight:600; color:var(--ink); background:rgba(255,255,255,.9); padding:4px 11px; border-radius:999px; backdrop-filter:blur(4px)}
.acard-b{padding:22px 22px 24px; display:flex; flex-direction:column; flex:1}
.acard-b h3{font-size:21px; font-weight:600; letter-spacing:-.02em; line-height:1.18}
.acard-b p{color:var(--muted); font-size:15px; margin-top:10px; line-height:1.45; flex:1; font-weight:400}
.acard-meta{margin-top:18px; font-size:13px; color:var(--faint)}
.soon-badge{font-size:12px; font-weight:500; color:var(--faint)}
.center-cta{text-align:center; margin-top:48px}

.quiz{padding:clamp(40px,6vw,72px) 0 clamp(56px,7vw,88px)}
.qbar{display:flex; align-items:center; gap:16px; margin-bottom:clamp(40px,5vw,56px)}
.qback{width:40px; height:40px; border-radius:50%; background:var(--bg2); display:grid; place-items:center; color:var(--muted); font-size:17px; transition:.18s; flex:none}
.qback:hover{background:#ececef; color:var(--ink)}
.qprog{flex:1; height:4px; border-radius:999px; background:var(--line); overflow:hidden}
.qprog i{display:block; height:100%; background:var(--accent); border-radius:999px; transition:width .5s cubic-bezier(.4,0,.2,1)}
.qnum{font-size:14px; color:var(--faint); font-variant-numeric:tabular-nums; flex:none}
.qblock{animation:rise .45s ease}
.qlabel{font-size:15px; font-weight:400; color:var(--faint)}
.qtitle{font-size:clamp(30px,4.6vw,50px); font-weight:600; letter-spacing:-.03em; line-height:1.06; margin-top:12px}
.qhint{color:var(--muted); font-size:18px; margin-top:14px; font-weight:400; letter-spacing:-.015em}
.qopts{margin-top:clamp(32px,4vw,44px); display:grid; gap:12px}
.qopt{text-align:left; padding:22px 24px; border-radius:18px; background:var(--bg2); transition:transform .18s, background .18s; display:flex; align-items:center; gap:18px}
.qopt:hover{background:#ececef; transform:scale(1.01)}
.qopt .qe{font-size:26px; flex:none; width:34px; text-align:center}
.qopt .ql{font-size:19px; font-weight:600; letter-spacing:-.02em}
.qopt .qd{font-size:14.5px; color:var(--muted); margin-top:2px; font-weight:400}

.result{padding:clamp(44px,6vw,72px) 0 clamp(56px,7vw,88px); animation:fade .5s ease}
.res-head{text-align:center; max-width:600px; margin:0 auto clamp(40px,5vw,60px)}
.res-head h2{font-size:clamp(32px,4.6vw,52px); font-weight:600; letter-spacing:-.03em; line-height:1.06}
.res-head p{color:var(--muted); margin-top:16px; font-size:19px; font-weight:400; letter-spacing:-.015em}
.rcard{display:grid; grid-template-columns:300px 1fr; gap:clamp(28px,5vw,60px); align-items:center; background:var(--bg2); border-radius:30px; padding:clamp(28px,4vw,52px)}
.rviz{aspect-ratio:3/4; display:grid; place-items:center; position:relative; border-radius:20px; overflow:hidden; background:#EFEAE0}
.rviz .pimg{height:100%; width:100%; object-fit:cover}
.rmatch{position:absolute; top:0; left:0; font-size:13px; font-weight:500; color:var(--muted)}
.rbody{display:flex; flex-direction:column}
.rmaison{font-size:15px; font-weight:500; color:var(--accent-deep)}
.rname{font-size:clamp(30px,4vw,46px); font-weight:600; letter-spacing:-.03em; line-height:1.03; margin-top:8px}
.rsub{color:var(--faint); font-size:15px; margin-top:10px}
.rnote{color:var(--muted); font-size:17px; line-height:1.5; margin-top:18px; max-width:46ch; font-weight:400; letter-spacing:-.01em}
.why{margin-top:22px; padding:18px 20px; border-left:4px solid var(--accent); border-radius:0 14px 14px 0; background:var(--bg)}
.why strong{font-size:14px; color:var(--accent-deep)}
.why-list{margin:8px 0 0; padding-left:19px; color:var(--muted); font-size:14px}
.why-list li+li{margin-top:5px}
.rtags{display:flex; flex-wrap:wrap; gap:8px; margin-top:20px}
.tag{font-size:13.5px; font-weight:400; color:var(--muted); background:var(--bg); padding:6px 14px; border-radius:999px}
.rbuy{margin-top:28px; display:flex; align-items:center; gap:20px; flex-wrap:wrap}
.rprice{font-size:28px; font-weight:600; letter-spacing:-.02em}
.aff-note{font-size:13px; color:var(--faint); margin-top:14px}
.alts-head{margin:clamp(48px,6vw,72px) 0 22px; font-size:22px; font-weight:600; letter-spacing:-.02em; text-align:center}
.alts{display:grid; grid-template-columns:repeat(3,1fr); gap:20px}
.alt{background:var(--bg2); border-radius:22px; padding:24px; display:flex; flex-direction:column}
.alt-top{display:flex; gap:16px; align-items:center}
.mini{width:52px; height:70px; flex:none; position:relative; display:grid; place-items:center; border-radius:12px; overflow:hidden; background:#EFEAE0}
.mini .pimg{height:100%; width:100%; object-fit:cover}
.mini .mm{position:absolute; bottom:-6px; left:50%; transform:translateX(-50%); font-size:11px; color:var(--faint); font-weight:500; white-space:nowrap}
.alt .an{font-size:18px; font-weight:600; letter-spacing:-.02em; line-height:1.1}
.alt .ah{font-size:13px; color:var(--faint); margin-top:3px}
.alt-foot{margin-top:20px; padding-top:18px; border-top:1px solid var(--border); display:flex; align-items:center; justify-content:space-between}
.alt-price{font-size:19px; font-weight:600}
.res-again{text-align:center; margin-top:clamp(44px,5vw,60px)}

.blogpage{padding:clamp(56px,7vw,96px) 0}

.article{padding:clamp(44px,6vw,72px) 0 clamp(64px,8vw,104px); animation:fade .4s ease}
.a-back{font-size:15px; color:var(--muted); display:inline-flex; gap:6px; margin-bottom:32px}
.a-back:hover{color:var(--ink)}
.a-cat{font-size:15px; font-weight:500; color:var(--accent-deep)}
.a-title{font-size:clamp(32px,5vw,52px); font-weight:600; letter-spacing:-.03em; line-height:1.06; margin-top:14px}
.a-meta{color:var(--faint); font-size:15px; margin-top:18px}
.a-cover{height:260px; border-radius:24px; margin:32px 0 12px}
.prose{font-size:19px; line-height:1.62; color:#38383b; font-weight:400; letter-spacing:-.012em}
.prose h3{font-size:26px; font-weight:600; letter-spacing:-.025em; color:var(--ink); margin:40px 0 14px; line-height:1.15}
.prose p{margin:18px 0}
.prose ul{margin:18px 0; padding-left:22px}
.prose li{margin:10px 0}
.prose a{color:var(--accent-deep); text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1px}
.prose strong{font-weight:600; color:var(--ink)}
.aff-inline{border-radius:20px; padding:24px 26px; margin:30px 0; background:var(--bg2)}
.aff-inline .l{font-size:13px; font-weight:500; color:var(--faint)}
.aff-inline .n{font-size:20px; font-weight:600; letter-spacing:-.02em; margin-top:6px}
.aff-inline .row{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-top:14px}
.article-cta{margin-top:52px; padding:40px; border-radius:26px; background:var(--bg2); text-align:center}
.article-cta h3{font-size:26px; font-weight:600; letter-spacing:-.025em}
.article-cta p{color:var(--muted); margin:10px 0 22px; font-size:17px}

/* ---------- Comparateur ---------- */
.compare-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
.compare-choice{border:1px solid var(--line); border-radius:18px; padding:18px; text-align:left; background:var(--bg); transition:.18s}
.compare-choice:hover{border-color:var(--border); transform:translateY(-2px)}
.compare-choice.on{border-color:var(--accent); background:#FBF8F1; box-shadow:0 0 0 2px rgba(156,122,52,.12)}
.compare-choice strong{display:block; font-size:17px}
.compare-choice span{display:block; color:var(--muted); font-size:13.5px; margin-top:4px}
.compare-status{margin:22px 0; padding:16px 18px; border-radius:16px; background:var(--bg2); color:var(--muted)}
.compare-tools{display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:24px}
.compare-search{flex:1 1 280px; min-height:46px; border:1px solid var(--border); border-radius:999px; padding:0 18px; font:inherit; color:var(--ink); background:var(--bg)}
.catalogue-tools{margin:0 0 30px; padding:22px; border:1px solid var(--border); border-radius:22px; background:var(--bg2)}
.catalogue-search{width:100%; min-height:50px; border:1px solid var(--border); border-radius:14px; padding:0 16px; font:inherit; color:var(--ink); background:var(--bg)}
.catalogue-filters{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-top:12px}
.catalogue-filter{display:grid; gap:6px; color:var(--muted); font-size:13px; font-weight:600}
.catalogue-filter select{width:100%; min-height:44px; border:1px solid var(--border); border-radius:12px; padding:0 12px; color:var(--ink); background:var(--bg); font:inherit}
.catalogue-summary{display:flex; justify-content:space-between; gap:16px; align-items:center; margin-top:16px; color:var(--muted); font-size:14px}
.catalogue-empty{padding:36px; border:1px dashed var(--border); border-radius:18px; text-align:center; color:var(--muted)}
[hidden]{display:none!important}
.sr-only{position:absolute!important; width:1px!important; height:1px!important; padding:0!important; margin:-1px!important; overflow:hidden!important; clip:rect(0,0,0,0)!important; white-space:nowrap!important; border:0!important}
.compare-wrap{overflow-x:auto; margin-top:24px}
.compare-table{width:100%; border-collapse:separate; border-spacing:0; min-width:680px}
.compare-table th,.compare-table td{padding:16px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top}
.compare-table th{font-size:13px; color:var(--faint); font-weight:600}
.compare-table td:first-child{font-weight:600; color:var(--accent-deep); width:150px}
.duel{display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-top:34px}
.duel-col{background:var(--bg2); border-radius:24px; padding:30px}
.duel-col h2{font-size:27px; line-height:1.1}
.duel-verdict{margin-top:28px; border-left:4px solid var(--accent); padding:20px 24px; background:#FBF8F1; border-radius:0 16px 16px 0}

/* ---------- Bande éditoriale (relief visuel) ---------- */
.band{position:relative; margin:0; padding:clamp(72px,10vw,132px) 0; color:#F5ECD9; text-align:center; overflow:hidden}

.pscore{position:absolute; top:14px; right:14px; background:rgba(29,29,31,.82); color:#F3E7C9; font-size:16px; font-weight:600; padding:7px 12px; border-radius:14px; line-height:1; backdrop-filter:blur(4px)}

.pscore.big{position:static; display:inline-flex; align-items:baseline; gap:2px; font-size:22px; background:none; color:var(--accent-deep); padding:0; position:absolute; top:16px; left:16px; background:rgba(255,255,255,.9); padding:8px 12px; border-radius:14px}

.pcard-name{font-size:22px; font-weight:600; letter-spacing:-.02em; margin-top:4px; line-height:1.1}
.pcard-note{font-size:14px; color:var(--muted); line-height:1.5; margin-top:10px; flex:1}
.pcard-foot{margin-top:18px; display:flex; align-items:center; justify-content:space-between}
.pcard-price{font-size:20px; font-weight:600}

@keyframes rise{from{opacity:0; transform:translateY(12px)}to{opacity:1; transform:none}}

@media(max-width:840px){

  .rnote{max-width:none}
  .rtags,.rbuy{justify-content:center}

}

@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important}}

function prod(id){ return products().find(p=>p.id===id); }

/* Liens d'achat Amazon Partenaires. Le tag se change ICI, en une ligne.
   Tant qu'on n'a pas de flux (avec liens produits directs), on renvoie vers
   la recherche Amazon du produit, avec le tag de tracking. */
const AMAZON_TAG = 'quelchampagne-21';
/* Fiches produit Amazon (ASIN) pour des liens directs. À mettre à jour si une
   fiche disparaît. Sans ASIN, on retombe sur une recherche Amazon. */
const ASINS = {
  feuillatte:'B0B7XGK1F3', moet:'B00B16HGEU', clicquot:'B0D7RVRTHY', bollinger:'B01CSMX0OA',
  ruinart:'B0DLX43VSV', laurentperrier:'B009H2RFKK', perrierjouet:'B0G9535PPJ', domperignon:'B0DC6MPNGW',
  bouillot:'B00734VGCC', sancerre:'B0FNN9R58N', whisperingangel:'B0CX5S23XF',
};
function buyLink(p){
  if(p.commerceReady !== true) return null;
  if(p.aff && /tag=|awin1\.com|\/dp\//.test(p.aff)) return p.aff; // vrai lien de flux si présent
  if(ASINS[p.id]) return 'https://www.amazon.fr/dp/' + ASINS[p.id] + '?tag=' + AMAZON_TAG;
  return 'https://www.amazon.fr/s?k=' + encodeURIComponent(p.house + ' ' + p.name) + '&tag=' + AMAZON_TAG;
}
function priceText(p){
  if(p.priceMin && p.priceMax) return `${p.priceMin}–${p.priceMax} €`;
  return p.price ? `${p.price} €` : 'Prix à vérifier';
}
function productAction(p, label='Voir la fiche officielle'){
  const link = buyLink(p);
  if(link) return `<a class="btn btn-accent" href="${link}" target="_blank" rel="sponsored noopener" onclick="track('${p.id}')">Voir l'offre</a>`;
  if(p.sourceUrl) return `<a class="btn btn-ghost" href="${p.sourceUrl}" target="_blank" rel="noopener">${label}</a>`;
  return '';
}

function decisionGuide(p){
  let avoid="vous recherchez un style très différent de son profil principal.";
  if(p.profil.includes('profil_riche_ample')) avoid="vous cherchez avant tout une expression très légère et délicate.";
  else if(p.profil.includes('profil_delicat')) avoid="vous préférez un champagne puissant et résolument vineux.";
  else if(p.profil.includes('profil_frais_vif')) avoid="vous recherchez surtout la rondeur et la puissance.";
  else if(p.profil.includes('profil_fruite')) avoid="vous préférez un registre austère et peu fruité.";
  return {
    choose:`vous cherchez une cuvée pour ${p.pair}, dans un registre ${p.tags.slice(0,2).join(' et ').toLowerCase()}.`,
    avoid
  };
}

    { id:'guide-2026', cat:'Guide', cover:'linear-gradient(135deg,#F3EEE2,#E9E0CC)', date:'Juillet 2026', read:'6 min',
      title:"Comment choisir son champagne en 2026",
      excerpt:"Occasion, style, budget : la méthode simple pour ne plus jamais se tromper devant le rayon.",
      body:`<p>Devant un rayon de champagnes, on est vite perdu : des dizaines d'étiquettes, des prix qui vont du simple au décuple, et un vocabulaire parfois opaque. Pourtant, choisir le bon flacon tient à trois questions simples.</p>
<h3>1. Partez de l'occasion</h3>
<p>Un apéritif entre amis n'appelle pas la même bouteille qu'un dîner gastronomique ou un cadeau. Pour trinquer sans se ruiner, un <strong>brut d'assemblage</strong> vif et fruité fait merveille. Pour une grande table, on montera en gamme vers un champagne plus structuré, voire un millésimé.</p>
<h3>2. Identifiez le style qui vous plaît</h3>
<p>Trois grandes familles se dégagent : les champagnes <strong>frais et vifs</strong> (dominante chardonnay, agrumes et minéralité), les <strong>fruités et généreux</strong> (assemblages faciles, ronds), et les <strong>riches et vineux</strong> (pinot noir, corps et longueur, parfaits à table). Un blanc de blancs comme le <a href="#" onclick="return openAff('ruinart')">Ruinart Blanc de Blancs</a> illustre à merveille le premier style.</p>
<h3>3. Fixez un budget, et respectez-le</h3>
<p>On trouve d'excellents champagnes dès 25 à 30 €. Entre 30 et 60 €, les grandes maisons déroulent leurs cuvées emblématiques. Au-delà, on entre dans l'exception et le prestige. Le prix ne fait pas tout : à budget égal, le style compte davantage que l'étiquette.</p>
<p>Pas envie de trancher seul ? Notre sélecteur pose quatre questions et vous oriente vers la cuvée juste, avec un lien direct vers la maison.</p>`,
      related:['feuillatte','ruinart','clicquot'] },
    { id:'dosages', cat:'Décryptage', cover:'linear-gradient(135deg,#EAEDE7,#DFE4D8)', date:'Juillet 2026', read:'4 min',
      title:"Brut, Extra-Brut, Demi-Sec : comprendre les dosages",
      excerpt:"Ce petit mot sur l'étiquette change tout au goût. Le guide clair des niveaux de sucre.",
      body:`<p>Le « dosage » désigne le sucre ajouté juste avant le bouchage final. C'est lui qui décide si un champagne vous paraîtra tranchant ou moelleux. Voici les repères à connaître.</p>
<h3>Du plus sec au plus doux</h3>
<ul>
<li><strong>Brut Nature / Non dosé</strong> (0 à 3 g/L) : aucun sucre ajouté. Droit, minéral, pour les amateurs de tension pure.</li>
<li><strong>Extra-Brut</strong> (0 à 6 g/L) : très sec, gastronomique, très en vogue.</li>
<li><strong>Brut</strong> (jusqu'à 12 g/L) : le standard, équilibré. 90 % des champagnes vendus.</li>
<li><strong>Extra-Dry</strong> (12 à 17 g/L) : légèrement tendre, parfait à l'apéritif.</li>
<li><strong>Sec, Demi-Sec, Doux</strong> (17 g/L et plus) : de plus en plus sucrés, à réserver aux desserts.</li>
</ul>
<h3>Lequel choisir ?</h3>
<p>Pour un usage polyvalent, restez sur un <strong>Brut</strong>. Si vous aimez la fraîcheur et comptez servir à table, tentez un <strong>Extra-Brut</strong>. Et pour accompagner une pâtisserie, seul un <strong>Demi-Sec</strong> tiendra tête au sucre du dessert.</p>`,
      related:['bollinger','moet'] },
    { id:'accords', cat:'Accords', cover:'linear-gradient(135deg,#F1ECE5,#E7DDD1)', date:'Juillet 2026', read:'7 min',
      title:"Accords mets & champagne : le guide complet",
      excerpt:"À chaque plat sa cuvée. Nos associations testées, de l'apéritif au dessert.",
      body:`<p>Le champagne n'est pas qu'un vin d'apéritif : c'est l'un des plus polyvalents à table. Encore faut-il accorder le bon style au bon plat.</p>
<h3>À l'apéritif</h3>
<p>Un brut vif et fruité ouvre l'appétit sans dominer. Le <a href="#" onclick="return openAff('moet')">Moët Impérial</a> ou un crémant malin font parfaitement l'affaire.</p>
<h3>Fruits de mer & poissons</h3>
<p>La minéralité d'un <strong>blanc de blancs</strong> épouse les huîtres et le poisson. Le chardonnay, tendu et salin, prolonge l'iode.</p>
<h3>Volailles & viandes blanches</h3>
<p>Ici, on veut du corps : un champagne <strong>vineux à dominante pinot noir</strong>, comme la <a href="#" onclick="return openAff('bollinger')">Special Cuvée de Bollinger</a>, tient tête à une volaille rôtie.</p>
<h3>Fromages</h3>
<p>Contrairement aux idées reçues, le champagne s'accorde mieux au fromage que bien des rouges. Privilégiez les pâtes dures (comté, vieux gouda) avec un champagne structuré.</p>
<h3>Desserts</h3>
<p>Seul un <strong>demi-sec</strong> ou un <strong>rosé fruité</strong> supporte le sucre. Sur des fruits rouges, un rosé de saignée fait des merveilles.</p>`,
      related:['ruinart','bollinger','laurentperrier'] },

    { id:'mariage', cat:'Guide', cover:'linear-gradient(135deg,#F4EFE6,#EAE0CE)', date:'Juillet 2026', read:'6 min',
      title:"Quel champagne choisir pour un mariage",
      excerpt:"Style, quantité, budget : le guide complet pour le champagne de votre grand jour.",
      body:`<p>Le champagne est au cœur d'un mariage : le vin d'honneur, le toast, parfois le repas entier. Bien le choisir évite le double écueil du flacon trop cher gaspillé et de la cuvée trop quelconque.</p>
<h3>Quel style servir ?</h3>
<p>Pour le vin d'honneur et le toast, on veut un champagne <strong>frais et consensuel</strong> qui plaît à tous : un brut d'assemblage ou un blanc de blancs, vif et élégant, comme le <a href="#" onclick="return openAff('ruinart')">Ruinart Blanc de Blancs</a>. Si le champagne accompagne le repas, montez en corps vers une cuvée plus vineuse capable de tenir face aux plats.</p>
<h3>Combien de bouteilles prévoir ?</h3>
<p>Comptez qu'une bouteille sert <strong>6 à 8 flûtes</strong>. Pour un vin d'honneur, prévoyez 2 à 3 coupes par personne, soit environ une bouteille pour trois invités. Mieux vaut en prévoir un peu trop : le champagne se conserve.</p>
<h3>Quel budget ?</h3>
<p>Sur de grandes quantités, un excellent brut entre 25 et 35 € par bouteille fait parfaitement le travail. Réservez une cuvée de prestige au seul moment du toast si vous voulez marquer le coup, plutôt que sur toute la soirée.</p>
<h3>La touche rosé</h3>
<p>Un champagne rosé comme la <a href="#" onclick="return openAff('laurentperrier')">Cuvée Rosé de Laurent-Perrier</a> apporte une note festive et photogénique, idéale pour un mariage.</p>
<p>Pas sûr du style qui vous correspond ? Notre sélecteur vous oriente en quatre questions.</p>`,
      related:['ruinart','clicquot','laurentperrier'] },

    { id:'cadeau', cat:'Guide', cover:'linear-gradient(135deg,#F1EDE4,#E7DECD)', date:'Juillet 2026', read:'5 min',
      title:"Quel champagne offrir en cadeau",
      excerpt:"Les valeurs sûres qui font toujours plaisir, par budget et par occasion.",
      body:`<p>Offrir du champagne ne trompe jamais, à condition de viser juste. Voici comment choisir une bouteille qui fera plaisir sans se ruiner ni se tromper.</p>
<h3>Misez sur une étiquette reconnaissable</h3>
<p>Pour un cadeau, la notoriété rassure. Une maison identifiable signale l'attention portée. Le <a href="#" onclick="return openAff('moet')">Moët Impérial</a> ou la Veuve Clicquot Yellow Label sont des valeurs sûres, immédiatement reconnues.</p>
<h3>Adaptez au budget</h3>
<p>Autour de 40 à 50 €, les grandes maisons offrent leurs cuvées emblématiques. Entre 60 et 90 €, on passe à des champagnes de caractère comme la <a href="#" onclick="return openAff('bollinger')">Special Cuvée de Bollinger</a>. Au-delà, un millésime précis comme <a href="#" onclick="return openAff('dom-perignon-vintage-2015')">Dom Pérignon Vintage 2015</a> permet de choisir une sortie clairement identifiée.</p>
<h3>Pensez au profil de la personne</h3>
<p>Un amateur de fraîcheur appréciera un blanc de blancs ; quelqu'un qui aime les vins de caractère préférera une cuvée vineuse. En cas de doute, un rosé fait presque toujours mouche.</p>
<h3>Le petit plus</h3>
<p>Un étui ou un coffret soigne la présentation et transforme la bouteille en vrai cadeau. Pas besoin de dépenser plus, juste de bien présenter.</p>

    { id:'quantite', cat:'Pratique', cover:'linear-gradient(135deg,#EEF0EB,#E3E7DD)', date:'Juillet 2026', read:'3 min',
      title:"Combien de bouteilles de champagne prévoir ?",
      excerpt:"La règle simple pour ne jamais manquer, ni trop acheter, selon le nombre d'invités.",
      body:`<p>Trop peu, et la fête tombe à plat. Trop, et le budget explose. Voici comment calculer juste.</p>

    { id:'blanc-blancs', cat:'Décryptage', cover:'linear-gradient(135deg,#ECEEE9,#E1E5DB)', date:'Juillet 2026', read:'4 min',
      title:"Blanc de Blancs ou Blanc de Noirs ?",
      excerpt:"Deux mots, deux mondes. On démêle les cépages et leurs styles.",
      body:`<p>Sur une étiquette de champagne, ces deux mentions racontent le cépage utilisé, et donc le style dans votre verre. Voici comment les distinguer.</p>

    { id:'huitres', cat:'Accords', cover:'linear-gradient(135deg,#EAEEEC,#DDE6E0)', date:'Juillet 2026', read:'4 min',

    { id:'anniversaire', cat:'Guide', cover:'linear-gradient(135deg,#F3ECE9,#E9DBD6)', date:'Juillet 2026', read:'5 min',

      excerpt:"Marquer le coup selon l'ambiance, la personne et le budget.",
      body:`<p>Un anniversaire appelle un champagne festif, mais le bon choix dépend de l'ambiance et de qui l'on fête. Voici comment viser juste.</p>

    { id:'brut-nature', cat:'Décryptage', cover:'linear-gradient(135deg,#EDEFEA,#E2E6DC)', date:'Juillet 2026', read:'4 min',
      title:"Brut Nature : le champagne des puristes",
      excerpt:"Zéro sucre ajouté, tension pure : le style qui monte, décrypté.",
      body:`<p>Sur les cartes des bars à vins et les tables gastronomiques, une mention revient de plus en plus : « Brut Nature ». Aussi appelé « non dosé » ou « dosage zéro », c'est le champagne dans sa version la plus nue.</p>

    { id:'rose-saignee', cat:'Décryptage', cover:'linear-gradient(135deg,#F3E9E7,#E9D6D2)', date:'Juillet 2026', read:'4 min',

      excerpt:"Deux méthodes, deux styles de champagne rosé. On vous explique.",
      body:`<p>Tous les champagnes rosés ne se ressemblent pas, et pour cause : il existe deux façons très différentes de les élaborer. Voici comment les distinguer, et laquelle choisir.</p>
<h3>Le rosé d'assemblage</h3>

    { id:'vigneron', cat:'Décryptage', cover:'linear-gradient(135deg,#ECEEE7,#E1E5D8)', date:'Juillet 2026', read:'5 min',
      title:"Champagne de vigneron ou grande maison ?",
      excerpt:"Deux visions du champagne. Comment les reconnaître, et laquelle vous convient.",
      body:`<p>Derrière chaque bouteille se cache un choix : le champagne d'une grande maison ou celui d'un vigneron indépendant. Deux philosophies, repérables sur l'étiquette.</p>

<h3>Alors, lequel ?</h3>
<p>Pour offrir ou pour une valeur sûre, une grande maison. Pour explorer et se faire plaisir malin, un vigneron. Les deux ont leur place à la cave.</p>`,
      related:['bollinger','feuillatte'] },

    { id:'etiquette', cat:'Pratique', cover:'linear-gradient(135deg,#F0EDE7,#E6E0D6)', date:'Juillet 2026', read:'5 min',
      title:"Comment lire une étiquette de champagne",
      excerpt:"Dosage, cépages, millésime, codes : tout ce que l'étiquette vous dit vraiment.",
      body:`<p>Une étiquette de champagne est pleine d'indices sur ce qui vous attend dans le verre. Apprenez à la décoder en cinq points.</p>
<h3>1. Le dosage</h3>
<p>« Brut », « Extra-Brut », « Demi-Sec »… ce mot indique le niveau de sucre, du plus sec au plus doux. C'est le premier repère de goût.</p>
<h3>2. Les cépages</h3>
<p>« Blanc de Blancs » signifie 100 % chardonnay, frais et fin. « Blanc de Noirs » veut dire raisins noirs, plus vineux. Sans mention, c'est un assemblage classique.</p>

<p>Une année indiquée (par exemple 2016) signale un champagne <strong>millésimé</strong>, issu d'une seule récolte, plus rare et à garder. Sans année, c'est un « brut sans année », assemblage de plusieurs récoltes pour un style constant.</p>
<h3>4. Le petit code</h3>
<p>Les lettres NM, RM, CM en bas indiquent qui a fait le champagne : grande maison (NM), vigneron (RM) ou coopérative (CM).</p>
<h3>5. La provenance</h3>
<p>Une mention comme « Grand Cru » ou « Premier Cru » renvoie au classement historique des villages d'origine des raisins. Elle renseigne la provenance, mais ne suffit pas à elle seule pour juger une cuvée.</p>`,

/* ====================== SCORING ====================== */
function budgetFitScore(p, budget){
  const min=Number.isFinite(p.priceMin) ? p.priceMin : p.price;
  const max=Number.isFinite(p.priceMax) ? p.priceMax : p.price;
  if(budget==='b4') return p.tier>=4 ? 40 : p.tier===3 ? 30 : p.tier===2 ? 15 : 5;
  const ranges={b1:[0,30],b2:[30,60],b3:[60,100]};
  const range=ranges[budget]||ranges.b2, lower=range[0], upper=range[1];
  const overlaps=max>=lower && min<=upper;
  if(overlaps) return min>=lower && max<=upper ? 40 : 34;
  if(min>upper){
    const over=min-upper;
    return over<=5 ? 24 : over<=15 ? 10 : 0;
  }
  const under=lower-max;
  return under<=10 ? 24 : under<=25 ? 10 : 0;
}
function score(p, a){
  const occ=(a.occasion||[])[0], gout=(a.gout||[])[0], bud=(a.budget||[])[0], pref=(a.maison||[])[0];
  const budgetScore = budgetFitScore(p, bud);
  const styleScore = p.profil.includes(gout) ? 25 : 6;
  const occasionScore = p.occ.includes(occ) ? 20 : 5;
  const availabilityScore = p.editorialReady ? 10 : 0;
  const popularityScore = Math.max(0, Math.min(5, ((p.popularity||70)/100)*5));
  const producerPenalty = pref && pref!=='any' && p.producerType!==pref ? 30 : 0;
  return budgetScore + styleScore + occasionScore + availabilityScore + popularityScore - producerPenalty;
}
function ranked(){
  const sc=products().map(p=>({p,s:score(p,state.answers)}));
  sc.sort((a,b)=>b.s-a.s || (b.p.popularity||0)-(a.p.popularity||0) || a.p.id.localeCompare(b.p.id,'fr'));
  return sc.map(x=>({...x, pct:Math.max(0,Math.min(99,Math.round(x.s)))}));
}

/* Aucune photographie distante n'est publiée sans registre de droits.
   Une composition éditoriale remplace le packshot tant qu'une image validée
   n'est pas associée explicitement à une fiche. */
const PHOTOS = {};
function photoSrc(u, w){
  if(u.startsWith('/')) return u;
  return u.includes('?') ? u : u + '?auto=format&fit=crop&w=' + (w||600) + '&q=72';
}
function editorialVisual(p, mode){
  const kind=p.producerType==='vigneron'?'Vigneron':'Maison';
  const meta=(p.tags||[]).slice(0,2).join(' · ');
  const initials=p.house.split(/\s+/).map(word=>word[0]).join('').slice(0,3).toUpperCase();
  const text=`${p.name} ${(p.tags||[]).join(' ')}`.toLowerCase();
  const palette=text.includes('rosé')
    ? ['#6E343B','#783F46','#63343F']
    : text.includes('blanc de blancs')
      ? ['#34433F','#3C4433','#2E4247']
      : p.producerType==='vigneron'
        ? ['#34412D','#473B2D','#29423B']
        : ['#233B34','#27364A','#40352D','#3E2934'];
  const paletteIndex=[...p.id].reduce((sum,char)=>sum+char.charCodeAt(0),0)%palette.length;
  const deep=palette[paletteIndex];
  const accent=p.accent||'#b89243';
  if(mode==='mini') return `<div class="editorial-visual visual-mini" style="--v-deep:${deep};--v-accent:${accent}" role="img" aria-label="${p.house} ${p.short}"><span class="visual-initials">${initials}</span></div>`;
  return `<div class="editorial-visual visual-${mode}" style="--v-deep:${deep};--v-accent:${accent}" role="img" aria-label="Présentation éditoriale de ${p.house} ${p.short}">
    <div class="visual-top"><span class="visual-kind">${kind}</span><span class="visual-region">Champagne</span></div>
    <div class="visual-copy"><div class="visual-house">${p.house}</div><div class="visual-cuvee">${p.short}</div><div class="visual-meta">${meta}</div></div>
  </div>`;
}
function bottleViz(p, mode){
  const img = p.image || PHOTOS[p.id];
  if(img) return `<img class="pimg product-packshot" src="${photoSrc(img, mode==='mini'?200:600)}" alt="Bouteille ${p.house} ${p.short}" loading="lazy">`;
  return editorialVisual(p, mode);
}

function renderQuiz(){
  const qs=questions(), q=qs[state.step], pct=(state.step/qs.length)*100;
  const opts=q.opts.map(o=>`<button class="qopt" onclick='answer(${JSON.stringify(q.id)},${JSON.stringify(o.tags)})'><span class="qe">${o.e}</span><span><span class="ql">${o.l}</span><br><span class="qd">${o.d}</span></span></button>`).join('');
  app.innerHTML = nav() + `
  <section class="quiz"><div class="narrow">
    <div class="qbar">
      <button class="qback" onclick="qBack()" aria-label="Question précédente">←</button>
      <div class="qprog" role="progressbar" aria-valuemin="1" aria-valuemax="${qs.length}" aria-valuenow="${state.step+1}"><i style="width:${pct}%"></i></div>
      <div class="qnum">${state.step+1} / ${qs.length}</div>
    </div>
    <div class="qblock" key="${state.animKey}">
      <div class="qlabel">${q.label}</div>
      <h1 class="qtitle">${q.q}</h1>
      <div class="qhint">${q.hint}</div>
      <div class="qopts">${opts}</div>
    </div>
  </div></section>` + foot();
}

function summary(){
  const occ=(state.answers.occasion||[])[0];
  const m={occ_fete:"Pour célébrer, voici la cuvée qui fera lever tous les verres.",occ_diner:"Pour votre dîner, une bouteille qui tiendra tête à vos plats.",occ_apero:"Pour l'apéritif, une bulle vive et conviviale.",occ_cadeau:"Pour offrir, une étiquette qui fait toujours son effet.",occ_romantique:"Pour un tête-à-tête, une cuvée délicate et tout en douceur."};
  return m[occ]||"D'après vos réponses, voici la cuvée faite pour vous.";
}

function matchReasons(p){
  const reasons=[];
  const a=state.answers;
  if((a.occasion||[]).some(tag=>p.occ.includes(tag))) reasons.push("Cette cuvée correspond à l’occasion choisie.");
  if((a.gout||[]).some(tag=>p.profil.includes(tag))) reasons.push("Son profil rejoint le style que vous recherchez.");
  const budget=(a.budget||[])[0];
  if(budget && budgetFitScore(p,budget)>=34) reasons.push("Sa fourchette éditoriale correspond à votre budget.");
  const producer=(a.maison||[])[0];
  if(producer && producer===p.producerType) reasons.push(`Elle correspond à votre préférence pour ${producer==='vigneron'?'un champagne de vigneron':'une grande maison'}.`);
  return reasons.slice(0,3);
}

/* ====================== ACTIONS ====================== */
function render(){
  ({home:renderHome, quiz:renderQuiz, result:renderResult, blog:renderBlog, article:renderArticle, shop:renderShop, product:renderProduct}[state.view])();
  const mainTarget=document.querySelector('#app section');
  if(mainTarget && !document.getElementById('main-content')) mainTarget.id='main-content';
  window.scrollTo({top:0, behavior:'smooth'});
}
function openProduct(id){ state.product=id; state.view='product'; render(); }
function go(v){ state.view=v; render(); }
function startQuiz(){ state.view='quiz'; state.step=0; state.answers={}; state.animKey++; render(); }
function answer(qid,tags){ state.answers[qid]=tags; if(state.step>=questions().length-1){ state.view='result'; } else { state.step++; state.animKey++; } render(); }
function qBack(){ if(state.step===0){ state.view='home'; } else { state.step--; state.animKey++; } render(); }
function openArticle(id){ state.article=id; state.view='article'; render(); }
function openAff(id){ const p=prod(id); const link=p&&(buyLink(p)||p.sourceUrl); if(link) window.open(link,'_blank','noopener'); return false; }
function track(id){ /* point d'accroche tracking d'affiliation (ex : ?ref=quelchampagne) */ }

/* Charge le catalogue live (catalogue.json) si présent ; sinon sélection intégrée. */
async function loadCatalogue(){
  try{
    const r = await fetch('/catalogue.json', {cache:'no-store'});
    if(!r.ok) return;
    const data = await r.json();
    if(Array.isArray(data) && data.length){
      CATALOGUE = data.map(p => ({
        glass:['#243c2e','#4a6a54'], foil:'#c9a85e', cork:'#7c5c3a', accent:'#9C7A34',
        tags:[], occ:[], profil:[], accords:[], bulles:'bulles_fines', tier:2,
        short: p.short || p.name, region: p.region || 'Champagne', ...p,
      }));
      render();
    }
  }catch(e){ /* repli silencieux */ }
}

/* Porte d'âge volontaire. */
function ageGate(){
  try{ if(localStorage.getItem('qc_age_ok')==='1') return; }catch(e){}
  const el = document.createElement('div');
  el.className = 'agegate'; el.id = 'agegate';
  el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true'); el.setAttribute('aria-labelledby','agegate-title');
  el.innerHTML = `
    <div class="agegate-box">
      <div class="g"></div>
      <h2 id="agegate-title">Vous avez 18 ans ou plus ?</h2>
      <p>${BRAND} est un site d'information sur le champagne, réservé aux personnes majeures.</p>
      <div class="btns">
        <button type="button" class="btn btn-primary" onclick="ageOK()">Oui, j'ai 18 ans ou plus</button>
        <button type="button" class="btn btn-ghost" onclick="ageNo()">Non</button>
      </div>
      <div class="health">L'abus d'alcool est dangereux pour la santé. À consommer avec modération.</div>
      <small>En entrant, vous confirmez être majeur selon la législation de votre pays.</small>
    </div>`;
  document.body.appendChild(el);
  document.body.style.overflow='hidden';
  const controls=[...el.querySelectorAll('button')];
  if(controls[0]) controls[0].focus();
  el.addEventListener('keydown',event=>{
    if(event.key!=='Tab'||controls.length<2) return;
    if(event.shiftKey&&document.activeElement===controls[0]){event.preventDefault();controls[controls.length-1].focus();}
    else if(!event.shiftKey&&document.activeElement===controls[controls.length-1]){event.preventDefault();controls[0].focus();}
  });
}
function ageOK(){ try{ localStorage.setItem('qc_age_ok','1'); }catch(e){} const el=document.getElementById('agegate'); if(el) el.remove(); document.body.style.overflow=''; }
function ageNo(){ const el=document.getElementById('agegate'); if(el) el.querySelector('.agegate-box').innerHTML = `<div class="g"></div><h2>À bientôt</h2><p>Ce site est réservé aux personnes majeures. Nous ne pouvons pas vous donner accès au contenu.</p><div class="health">L'abus d'alcool est dangereux pour la santé. À consommer avec modération.</div>`; }

render();
loadCatalogue();
ageGate();
</script>
