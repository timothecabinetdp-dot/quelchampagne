<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuelChampagne · Choisir un champagne selon vos critères</title>
<meta name="description" content="Comparez les champagnes selon le moment, le repas, vos goûts et votre budget. Cinq choix donnent accès à une sélection expliquée et à des fiches détaillées.">
<meta property="og:type" content="website">
<meta property="og:title" content="QuelChampagne · Choisir un champagne selon vos critères">
<meta property="og:description" content="Cinq choix pour comparer les champagnes selon le moment, le repas, vos goûts et votre budget.">
<meta property="og:url" content="https://quelchampagne.fr">
<meta property="og:image" content="https://quelchampagne.fr/assets/og-quelchampagne.png">
<meta property="og:locale" content="fr_FR">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#ffffff">
<link rel="canonical" href="https://quelchampagne.fr">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M8.4 5H15.6L14.2 12.3A2.7 2.7 0 0 1 9.8 12.3Z' fill='%23F3E7C9' stroke='%239C7A34' stroke-width='1.2'/%3E%3Cline x1='12' y1='15' x2='12' y2='20.2' stroke='%239C7A34' stroke-width='1.3'/%3E%3Cline x1='9' y1='20.6' x2='15' y2='20.6' stroke='%239C7A34' stroke-width='1.3'/%3E%3C/svg%3E">
<script src="/assets/analytics.js" defer></script>
<style>
:root{
  --bg:#FFFFFF; --bg2:#F5F5F7; --ink:#1D1D1F; --muted:#6E6E73; --faint:#86868B;
  --border:#D2D2D7; --line:#E8E8ED;
  --accent:#1F4D3A; --accent-deep:#163B2C; --gold:#B8912F; --gold-deep:#977528;
  --sans:-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0}
html{scroll-behavior:smooth; -webkit-text-size-adjust:100%}
body{font-family:var(--sans); color:var(--ink); background:var(--bg); line-height:1.5; -webkit-font-smoothing:antialiased; letter-spacing:-.01em}
::selection{background:#E7DABD}
a{color:inherit; text-decoration:none}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
img{max-width:100%; display:block}
.skip-link{position:fixed; left:16px; top:10px; z-index:300; padding:10px 14px; border-radius:10px; background:var(--ink); color:#fff; transform:translateY(-150%); transition:transform .2s}
.skip-link:focus{transform:none}
:focus-visible{outline:3px solid #C99A1E; outline-offset:3px}
.container{max-width:1000px; margin:0 auto; padding:0 26px}
.narrow{max-width:700px; margin:0 auto; padding:0 26px}

.btn{display:inline-flex; align-items:center; gap:6px; font-size:16px; font-weight:400; padding:11px 22px; border-radius:980px; transition:background .2s, transform .2s, opacity .2s; white-space:nowrap}
.btn-primary{background:var(--accent); color:#fff}
.btn-primary:hover{opacity:.86}
.btn-accent{background:var(--accent); color:#fff}
.btn-accent:hover{background:var(--accent-deep)}
.btn-ghost{background:var(--bg2); color:var(--ink)}
.btn-ghost:hover{background:#ececef}
.btn-sm{font-size:14px; padding:8px 16px}
.chev{color:var(--accent-deep); font-size:16px; font-weight:400; display:inline-flex; align-items:center; gap:3px}
.chev:hover{text-decoration:underline; text-underline-offset:3px}
.chev::after{content:"›"; font-size:18px; line-height:1; transition:transform .2s}
.chev:hover::after{transform:translateX(3px)}

.nav{position:sticky; top:0; z-index:50; background:rgba(255,255,255,.72); backdrop-filter:saturate(180%) blur(20px); border-bottom:1px solid var(--line)}
.nav-in{display:flex; align-items:center; justify-content:space-between; height:52px}
.logo{display:flex; align-items:center; gap:8px; font-size:19px; font-weight:600; letter-spacing:-.02em; cursor:pointer}
.logo .g{width:15px; height:15px; border-radius:50%; background:linear-gradient(150deg,#E7D3A0,#9C7A34)}
.logo-txt{font-weight:450}
.logo-txt b{font-weight:600}
.foot-brand-name{display:inline-flex; align-items:center; gap:8px}
.nav-links{display:flex; align-items:center; gap:28px}
.nav-toggle{display:none; width:44px; height:44px; align-items:center; justify-content:center; flex-direction:column; gap:5px; border:1px solid var(--border); background:#fff}
.nav-toggle span{display:block; width:19px; height:2px; background:var(--ink); transition:transform .2s,opacity .2s}
.nav.is-open .nav-toggle span:first-child{transform:translateY(3.5px) rotate(45deg)}
.nav.is-open .nav-toggle span:last-child{transform:translateY(-3.5px) rotate(-45deg)}
.nlink{font-size:14px; font-weight:400; color:var(--muted); transition:.18s}
.nlink:hover,.nlink.on{color:var(--ink)}

.hero{text-align:center; padding:clamp(64px,10vw,116px) 0 clamp(20px,4vw,44px)}
h1{font-size:clamp(42px,7vw,80px); font-weight:600; line-height:1.04; letter-spacing:-.035em}
.hero .lead{font-size:clamp(19px,2.3vw,26px); font-weight:400; color:var(--muted); max-width:24ch; margin:22px auto 0; line-height:1.32; letter-spacing:-.015em}
.hero-cta{margin-top:32px; display:flex; gap:22px; justify-content:center; align-items:center; flex-wrap:wrap}
.hero-visual{margin:clamp(28px,4vw,52px) auto 0; width:100%; max-width:620px; height:clamp(240px,34vw,380px); border-radius:26px; overflow:hidden; box-shadow:0 40px 60px -34px rgba(29,29,31,.4)}
.hero-visual svg{height:100%; width:auto; margin:0 auto; display:block; filter:drop-shadow(0 40px 50px rgba(29,29,31,.22))}
.hero-visual .pimg{width:100%; height:100%}
.pimg{width:100%; height:100%; object-fit:cover; display:block}
.trust-strip{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; max-width:850px; margin:34px auto 0; overflow:hidden; border:1px solid var(--line); border-radius:20px; background:var(--line)}
.trust-item{padding:18px; background:var(--bg); text-align:left}
.trust-item strong{display:block; font-size:15px}
.trust-item span{display:block; margin-top:4px; color:var(--muted); font-size:13px; line-height:1.4}

/* ===== Refonte festive : hero photo, bulles, animations ===== */
.hero-photo{position:relative; overflow:hidden; text-align:center; color:#fff; padding:clamp(104px,15vw,180px) 0 clamp(84px,11vw,132px); display:flex; align-items:center; min-height:clamp(540px,74vh,780px)}
.hero-photo::before{content:""; position:absolute; inset:0; background-image:var(--hero-img); background-size:cover; background-position:center; z-index:0; animation:heroZoom 20s ease-out forwards}
.hero-photo::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(24,18,8,.58) 0%, rgba(24,18,8,.40) 38%, rgba(24,18,8,.74) 100%); z-index:1}
.hero-photo .container{position:relative; z-index:3; width:100%}
@keyframes heroZoom{from{transform:scale(1.16)}to{transform:scale(1.03)}}
.hero-photo h1{color:#fff; text-shadow:0 2px 34px rgba(0,0,0,.4)}
.hero-photo .lead{font-size:clamp(19px,2.3vw,27px); font-weight:400; color:rgba(255,255,255,.92); max-width:26ch; margin:22px auto 0; line-height:1.32; letter-spacing:-.015em; text-shadow:0 1px 18px rgba(0,0,0,.35)}
.hero-photo .hero-cta{margin-top:36px; display:flex; gap:22px; justify-content:center; align-items:center; flex-wrap:wrap}
.hero-photo .chev{color:#fff}
.btn-lg{padding:16px 30px; font-size:16px; border-radius:999px}
/* bulles de champagne */
.bubbles{position:absolute; inset:0; z-index:2; overflow:hidden; pointer-events:none}
.bubbles i{position:absolute; bottom:-40px; border-radius:50%; background:radial-gradient(circle at 32% 30%, rgba(255,255,255,.95), rgba(255,238,196,.4) 58%, rgba(255,238,196,0) 72%); opacity:0; animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) scale(.5); opacity:0}12%{opacity:.9}88%{opacity:.6}100%{transform:translateY(-104vh) scale(1); opacity:0}}
/* CTA quiz dans la nav */
.nlink-cta{display:inline-flex; align-items:center; gap:7px; padding:0; border:0; background:none; color:var(--ink); font-family:inherit; font-size:14px; font-weight:500; cursor:pointer; line-height:1; letter-spacing:-.01em; transition:color .18s}
.nlink-cta:hover{color:var(--accent-deep)}
.nlink-cta svg{flex:none; margin-top:-1px}
.btn-lg{border-radius:12px}
/* en-tête de page illustrée (sélection) */
.page-hero{position:relative; overflow:hidden; color:#fff; padding:clamp(60px,9vw,110px) 0 clamp(42px,6vw,74px); margin-bottom:clamp(18px,3vw,32px)}
.page-hero::before{content:""; position:absolute; inset:0; background-image:var(--ph-img); background-size:cover; background-position:center; z-index:0}
.page-hero::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(18,13,5,.68) 0%, rgba(18,13,5,.72) 45%, rgba(18,13,5,.86) 100%); z-index:1}
.page-hero .container{position:relative; z-index:2}
.page-hero h1{color:#fff; text-shadow:0 2px 26px rgba(0,0,0,.55)}
.page-hero p{color:rgba(255,255,255,.94) !important; text-shadow:0 1px 16px rgba(0,0,0,.5)}
.page-hero .tag{background:rgba(255,255,255,.16); color:#fff}
.page-hero .tag:hover{background:rgba(255,255,255,.30)}
/* apparitions au scroll */
.reveal{opacity:0; transform:translateY(28px); transition:opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1; transform:none}
.btn{transition:transform .18s, opacity .18s, background .18s, box-shadow .18s}
.btn-primary:hover,.btn-accent:hover{transform:translateY(-1px)}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1 !important; transform:none !important}.hero-photo::before{animation:none}.bubbles{display:none}}

.section{padding:clamp(64px,9vw,116px) 0}
.section.gray{background:var(--bg2)}
.sec-head{text-align:center; max-width:640px; margin:0 auto clamp(40px,5vw,64px)}
.h2{font-size:clamp(30px,4.4vw,52px); font-weight:600; letter-spacing:-.03em; line-height:1.07}
.sec-head p{font-size:clamp(17px,2vw,22px); color:var(--muted); margin-top:16px; font-weight:400; letter-spacing:-.015em; line-height:1.4}

.steps{display:grid; grid-template-columns:repeat(3,1fr); gap:22px}
.step{background:var(--bg); border-radius:24px; padding:40px 32px; text-align:left}
.section:not(.gray) .step{background:var(--bg2)}
.step .n{font-size:15px; font-weight:600; color:var(--accent)}
.step h3{font-size:23px; font-weight:600; letter-spacing:-.02em; margin-top:18px}
.step p{color:var(--muted); font-size:16px; margin-top:10px; line-height:1.45; font-weight:400}

.maisons{display:flex; flex-wrap:wrap; justify-content:center; gap:14px 40px; max-width:760px; margin:0 auto}
.maison-name{font-size:clamp(18px,2.2vw,24px); font-weight:500; color:var(--faint); letter-spacing:-.01em; transition:.2s}
.maison-name:hover{color:var(--ink)}

.cards{display:grid; grid-template-columns:repeat(3,1fr); gap:24px}
.acard{border-radius:22px; overflow:hidden; background:var(--bg); cursor:pointer; transition:transform .25s; display:flex; flex-direction:column; box-shadow:0 2px 10px rgba(29,29,31,.04)}
.section.gray .acard{box-shadow:0 4px 20px rgba(29,29,31,.06)}
.acard:hover{transform:translateY(-5px)}
.acard.soon{cursor:default; opacity:.6}
.acard.soon:hover{transform:none}
.acard-cover{height:158px; position:relative}
.acard-cat{position:absolute; top:14px; left:14px; font-size:12.5px; font-weight:600; color:var(--ink); background:rgba(255,255,255,.9); padding:4px 11px; border-radius:999px; backdrop-filter:blur(4px)}
.acard-b{padding:22px 22px 24px; display:flex; flex-direction:column; flex:1}
.acard-b h3{font-size:21px; font-weight:600; letter-spacing:-.02em; line-height:1.18}
.acard-b p{color:var(--muted); font-size:15px; margin-top:10px; line-height:1.45; flex:1; font-weight:400}
.acard-meta{margin-top:18px; font-size:13px; color:var(--faint)}
.soon-badge{font-size:12px; font-weight:500; color:var(--faint)}
.center-cta{text-align:center; margin-top:48px}

.quiz{min-height:calc(100vh - 52px);padding:clamp(40px,6vw,72px) 0 clamp(56px,7vw,88px);background:#fff}
.qbar{display:flex; align-items:center; gap:16px; margin-bottom:clamp(40px,5vw,56px)}
.qback{width:40px; height:40px; border-radius:50%; background:transparent; border:1px solid var(--border); display:grid; place-items:center; color:var(--muted); font-size:17px; transition:.18s; flex:none}
.qback:hover{border-color:var(--ink); color:var(--ink)}
.qprog{flex:1; height:4px; border-radius:999px; background:var(--line); overflow:hidden}
.qprog i{display:block; height:100%; background:var(--accent); border-radius:999px; transition:width .5s cubic-bezier(.4,0,.2,1)}
.qnum{font-size:14px; color:var(--faint); font-variant-numeric:tabular-nums; flex:none}
.qblock{animation:rise .45s ease}
.qlabel{font-size:15px; font-weight:400; color:var(--faint)}
.qtitle{font-size:clamp(30px,4.6vw,50px); font-weight:600; letter-spacing:-.03em; line-height:1.06; margin-top:12px}
.qhint{color:var(--muted); font-size:18px; margin-top:14px; font-weight:400; letter-spacing:-.015em}
.qopts{margin-top:clamp(32px,4vw,44px); display:grid; gap:12px}
.qopt{text-align:left; padding:22px 24px; border-radius:18px; background:#F4F4F1; border:1px solid transparent; transition:transform .18s, border-color .18s, box-shadow .18s; display:flex; align-items:center; gap:18px}
.qopt:hover{border-color:var(--ink); box-shadow:0 12px 28px -24px rgba(20,20,18,.55); transform:translateY(-2px)}
.qopt .qe{font-size:12px; font-weight:700; letter-spacing:.08em; color:var(--accent-deep); flex:none; width:34px; text-align:left}
.qopt .ql{font-size:19px; font-weight:600; letter-spacing:-.02em}
.qopt .qd{font-size:14.5px; color:var(--muted); margin-top:2px; font-weight:400}
.selector-guide{padding:clamp(64px,8vw,108px) 0;background:#F4F4F1;border-top:1px solid #D9D9D4}
.selector-guide-head{max-width:850px}
.selector-guide-head h2{font-family:var(--display);font-size:clamp(34px,5.5vw,68px);font-weight:900;text-transform:uppercase;letter-spacing:-.025em;line-height:.95;margin-top:12px}
.selector-guide-head>p{max-width:68ch;color:var(--muted);font-size:18px;line-height:1.65;margin-top:24px}
.selector-guide-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin-top:48px;border-top:1px solid #CFCAC0;border-bottom:1px solid #CFCAC0}
.selector-guide-grid article{padding:26px 22px 30px;border-right:1px solid #CFCAC0}
.selector-guide-grid article:last-child{border-right:0}
.selector-guide-grid span{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--accent-deep)}
.selector-guide-grid h3{font-size:19px;margin-top:18px}
.selector-guide-grid p{color:var(--muted);font-size:14px;line-height:1.55;margin-top:10px}
.selector-faq{max-width:850px;margin-top:46px;border-top:1px solid #CFCAC0}
.selector-faq details{border-bottom:1px solid #CFCAC0;padding:19px 0}
.selector-faq summary{cursor:pointer;font-weight:700;font-size:17px;list-style:none;display:flex;justify-content:space-between;gap:20px}
.selector-faq summary::after{content:'+';color:var(--accent-deep);font-size:22px;font-weight:400}
.selector-faq details[open] summary::after{content:'–'}
.selector-faq details p{color:var(--muted);max-width:70ch;line-height:1.6;margin-top:12px}

.result{padding:clamp(44px,6vw,72px) 0 clamp(56px,7vw,88px); background:#fff; animation:fade .5s ease}
.res-head{text-align:center; max-width:880px; margin:0 auto clamp(40px,5vw,60px)}
.res-head h1{font-family:var(--display);font-size:clamp(34px,5.5vw,66px);font-weight:900;text-transform:uppercase;letter-spacing:-.03em;line-height:.96;margin-top:12px}
.res-head p{color:var(--muted); margin-top:16px; font-size:19px; font-weight:400; letter-spacing:-.015em}
.criteria-summary{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:24px}
.criteria-summary span{border:1px solid var(--border);padding:7px 11px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.045em;color:#514c44}
.rcard{display:grid; grid-template-columns:320px 1fr; gap:clamp(28px,5vw,60px); align-items:center; background:transparent; border-top:1px solid #D9D9D4; border-bottom:1px solid #D9D9D4; padding:clamp(34px,5vw,62px) 0}
.rviz{height:430px; display:grid; place-items:center; position:relative; overflow:hidden; background:transparent; padding:18px; box-sizing:border-box; contain:layout paint}
.rviz .pimg{width:100%!important; height:100%!important; max-width:100%; max-height:100%; object-fit:contain!important; object-position:center!important; margin:0}
.rbody{display:flex; flex-direction:column}
.rmaison{font-size:15px; font-weight:500; color:var(--accent-deep)}
.rname{font-size:clamp(30px,4vw,46px); font-weight:600; letter-spacing:-.03em; line-height:1.03; margin-top:8px}
.rsub{color:var(--faint); font-size:15px; margin-top:10px}
.rnote{color:var(--muted); font-size:17px; line-height:1.5; margin-top:18px; max-width:46ch; font-weight:400; letter-spacing:-.01em}
.why{margin-top:22px; padding:18px 0; border-top:1px solid var(--border); border-bottom:1px solid var(--border); background:transparent}
.why strong{font-size:14px; color:var(--accent-deep)}
.why-list{margin:8px 0 0; padding-left:19px; color:var(--muted); font-size:14px}
.why-list li+li{margin-top:5px}
.rtags{display:flex; flex-wrap:wrap; gap:8px; margin-top:20px}
.tag{font-size:13.5px; font-weight:400; color:var(--muted); background:var(--bg); padding:6px 14px; border-radius:999px}
.rbuy{margin-top:28px; display:flex; align-items:center; gap:20px; flex-wrap:wrap}
.rprice{font-size:28px; font-weight:600; letter-spacing:-.02em}
.aff-note{font-size:13px; color:var(--faint); margin-top:14px}
.alts-head{margin:clamp(48px,6vw,72px) 0 22px; font-size:22px; font-weight:600; letter-spacing:-.02em; text-align:center}
.alts{display:grid; grid-template-columns:repeat(3,1fr); gap:20px}
.alt{background:transparent; border-top:1px solid #D9D9D4; border-bottom:1px solid #D9D9D4; padding:24px 0; display:flex; flex-direction:column}
.alt-main{display:grid; grid-template-columns:86px minmax(0,1fr); gap:20px; align-items:center}
.mini{width:86px; height:132px; flex:none; position:relative; display:grid; place-items:center; overflow:hidden; background:transparent; padding:4px; box-sizing:border-box; contain:layout paint}
.mini .pimg{width:100%!important; height:100%!important; max-width:100%; max-height:100%; object-fit:contain!important; object-position:center!important; margin:0}
.alt-copy{min-width:0}
.alt .an{font-size:18px; font-weight:600; letter-spacing:-.02em; line-height:1.1}
.alt .ah{font-size:13px; color:var(--faint); margin-top:3px}
.alt-reason{color:var(--muted);font-size:14px;line-height:1.5;margin:12px 0 0;min-height:3em}
.alt-foot{margin-top:20px; padding-top:18px; border-top:1px solid var(--border); display:flex; align-items:center; justify-content:space-between}
.alt-price{font-size:19px; font-weight:600}
.res-again{text-align:center; margin-top:clamp(44px,5vw,60px)}

.blogpage{padding:clamp(56px,7vw,96px) 0}

.article{padding:clamp(44px,6vw,72px) 0 clamp(64px,8vw,104px); animation:fade .4s ease}
.a-back{font-size:15px; color:var(--muted); display:inline-flex; gap:6px; margin-bottom:32px}
.a-back:hover{color:var(--ink)}
.a-cat{font-size:15px; font-weight:500; color:var(--accent-deep)}
.a-title{font-size:clamp(32px,5vw,52px); font-weight:600; letter-spacing:-.03em; line-height:1.06; margin-top:14px}
.a-meta{color:var(--faint); font-size:15px; margin-top:18px}
.a-cover{height:260px; border-radius:24px; margin:32px 0 12px}
.prose{font-size:19px; line-height:1.62; color:#38383b; font-weight:400; letter-spacing:-.012em}
.prose h3{font-size:26px; font-weight:600; letter-spacing:-.025em; color:var(--ink); margin:40px 0 14px; line-height:1.15}
.prose p{margin:18px 0}
.prose ul{margin:18px 0; padding-left:22px}
.prose li{margin:10px 0}
.prose a{color:var(--accent-deep); text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1px}
.prose strong{font-weight:600; color:var(--ink)}
.aff-inline{border-radius:20px; padding:24px 26px; margin:30px 0; background:var(--bg2)}
.aff-inline .l{font-size:13px; font-weight:500; color:var(--faint)}
.aff-inline .n{font-size:20px; font-weight:600; letter-spacing:-.02em; margin-top:6px}
.aff-inline .row{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-top:14px}
.article-cta{margin-top:52px; padding:40px; border-radius:26px; background:var(--bg2); text-align:center}
.article-cta h3{font-size:26px; font-weight:600; letter-spacing:-.025em}
.article-cta p{color:var(--muted); margin:10px 0 22px; font-size:17px}

/* ---------- Comparateur ---------- */
.compare-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
.compare-choice{border:1px solid var(--line); border-radius:18px; padding:18px; text-align:left; background:var(--bg); transition:.18s}
.compare-choice:hover{border-color:var(--border); transform:translateY(-2px)}
.compare-choice.on{border-color:var(--accent); background:#FBF8F1; box-shadow:0 0 0 2px rgba(156,122,52,.12)}
.compare-choice strong{display:block; font-size:17px}
.compare-choice span{display:block; color:var(--muted); font-size:13.5px; margin-top:4px}
.compare-status{margin:22px 0; padding:16px 18px; border-radius:16px; background:var(--bg2); color:var(--muted)}
.compare-tools{display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:24px}
.compare-search{flex:1 1 280px; min-height:46px; border:1px solid var(--border); border-radius:999px; padding:0 18px; font:inherit; color:var(--ink); background:var(--bg)}
.catalogue-tools{margin:0 0 30px; padding:22px; border:1px solid var(--border); border-radius:22px; background:var(--bg2)}
.catalogue-search{width:100%; min-height:50px; border:1px solid var(--border); border-radius:14px; padding:0 16px; font:inherit; color:var(--ink); background:var(--bg)}
.catalogue-filters{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-top:12px}
.catalogue-filter{display:grid; gap:6px; color:var(--muted); font-size:13px; font-weight:600}
.catalogue-filter select{width:100%; min-height:44px; border:1px solid var(--border); border-radius:12px; padding:0 12px; color:var(--ink); background:var(--bg); font:inherit}
.catalogue-summary{display:flex; justify-content:space-between; gap:16px; align-items:center; margin-top:16px; color:var(--muted); font-size:14px}
.catalogue-empty{padding:36px; border:1px dashed var(--border); border-radius:18px; text-align:center; color:var(--muted)}
[hidden]{display:none!important}
.sr-only{position:absolute!important; width:1px!important; height:1px!important; padding:0!important; margin:-1px!important; overflow:hidden!important; clip:rect(0,0,0,0)!important; white-space:nowrap!important; border:0!important}
.compare-wrap{overflow-x:auto; margin-top:24px}
.compare-table{width:100%; border-collapse:separate; border-spacing:0; min-width:680px}
.compare-table th,.compare-table td{padding:16px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top}
.compare-table th{font-size:13px; color:var(--faint); font-weight:600}
.compare-table td:first-child{font-weight:600; color:var(--accent-deep); width:150px}
.duel{display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-top:34px}
.duel-col{background:var(--bg2); border-radius:24px; padding:30px}
.duel-col h2{font-size:27px; line-height:1.1}
.duel-verdict{margin-top:28px; border-left:4px solid var(--accent); padding:20px 24px; background:#FBF8F1; border-radius:0 16px 16px 0}

/* ---------- Bande éditoriale photographique ---------- */
.band{position:relative; margin:0; padding:clamp(88px,12vw,160px) 0; color:#fff; text-align:left; overflow:hidden; background:#18140f url('https://images.unsplash.com/photo-1498429152472-9a433d9ddf3b?q=82&w=2000&auto=format&fit=crop') center 48%/cover no-repeat}
.band::before{content:""; position:absolute; inset:0; background:linear-gradient(90deg,rgba(15,12,8,.88) 0%,rgba(15,12,8,.68) 48%,rgba(15,12,8,.18) 100%); z-index:0}
.band>*{position:relative; z-index:1}
.band .eyebrow-l{font-size:12.5px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:#E0C489}
.band h2{font-size:clamp(34px,5vw,60px); font-weight:700; letter-spacing:-.035em; line-height:1.02; margin-top:16px; max-width:17ch}
.band p{font-size:clamp(16px,2vw,19px); color:#F1E7D5; max-width:42ch; margin:20px 0 0; line-height:1.55}
.band .btn{margin-top:30px}

/* ---------- Catalogue « La sélection » ---------- */
.section-lead{padding:clamp(48px,7vw,80px) 0 clamp(24px,3vw,36px)}
.lead-head{max-width:640px}
.lead-head p{color:var(--muted); font-size:clamp(17px,2vw,20px); margin-top:16px; line-height:1.45}
.pgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:24px}
.pcard{background:var(--bg); border-radius:22px; overflow:hidden; cursor:pointer; box-shadow:0 2px 12px rgba(29,29,31,.06); transition:transform .25s, box-shadow .25s; display:flex; flex-direction:column}
.pcard:hover{transform:translateY(-5px); box-shadow:0 24px 44px -24px rgba(29,29,31,.4)}
.pcard-img{height:230px; min-height:230px; position:relative; overflow:hidden; isolation:isolate; background:#fff}
.pcard-img .pimg{height:100%; width:100%; object-fit:cover}
.pscore{position:absolute; top:14px; right:14px; background:rgba(29,29,31,.82); color:#F3E7C9; font-size:16px; font-weight:600; padding:7px 12px; border-radius:14px; line-height:1; backdrop-filter:blur(4px)}
.pscore small{font-size:10px; opacity:.7; font-weight:500}
.pscore.big{position:static; display:inline-flex; align-items:baseline; gap:2px; font-size:22px; background:none; color:var(--accent-deep); padding:0; position:absolute; top:16px; left:16px; background:rgba(255,255,255,.9); padding:8px 12px; border-radius:14px}
.pcard-b{padding:20px 22px 22px; display:flex; flex-direction:column; flex:1}
.pcard-house{font-size:13px; font-weight:500; color:var(--accent-deep); letter-spacing:.02em}
.pcard-name{font-size:22px; font-weight:600; letter-spacing:-.02em; margin-top:4px; line-height:1.1}
.pcard-note{font-size:14px; color:var(--muted); line-height:1.5; margin-top:10px; flex:1}
.pcard-foot{margin-top:18px; display:flex; align-items:center; justify-content:space-between}
.pcard-price{font-size:20px; font-weight:600}

/* ---------- Visuels éditoriaux et futurs packshots autorisés ---------- */
.editorial-visual{--v-deep:#1f352a; --v-accent:#b89243; position:relative; width:100%; height:100%; overflow:hidden; display:flex; flex-direction:column; justify-content:space-between; padding:22px; color:#fff; background:var(--v-deep); background:linear-gradient(145deg,var(--v-deep),color-mix(in srgb,var(--v-deep) 72%,#000)); isolation:isolate}
.editorial-visual::before{content:""; position:absolute; z-index:-1; width:210px; height:210px; border-radius:50%; right:-76px; top:-96px; border:1px solid rgba(255,255,255,.2); box-shadow:0 0 0 28px rgba(255,255,255,.035),0 0 0 58px rgba(255,255,255,.025)}
.editorial-visual::after{content:""; position:absolute; z-index:-1; left:22px; right:22px; bottom:18px; height:1px; background:linear-gradient(90deg,var(--v-accent),rgba(255,255,255,.2))}
.visual-top{display:flex; justify-content:space-between; align-items:center; gap:12px; font-size:10.5px; font-weight:650; letter-spacing:.13em; text-transform:uppercase}
.visual-kind{padding:6px 9px; border:1px solid rgba(255,255,255,.28); border-radius:999px; background:rgba(255,255,255,.08); backdrop-filter:blur(4px)}
.visual-region{opacity:.68}
.visual-copy{max-width:92%; padding-bottom:15px}
.visual-house{font-size:12px; font-weight:650; letter-spacing:.16em; text-transform:uppercase; color:color-mix(in srgb,var(--v-accent) 72%,#fff)}
.visual-cuvee{font-size:clamp(24px,2.2vw,32px); font-weight:600; line-height:1.02; letter-spacing:-.035em; margin-top:7px; text-wrap:balance}
.visual-meta{font-size:11px; line-height:1.3; margin-top:11px; opacity:.72; text-transform:uppercase; letter-spacing:.08em}
.editorial-visual.visual-big{padding:clamp(26px,4vw,42px)}
.visual-big .visual-top{font-size:12px}
.visual-big .visual-house{font-size:14px}
.visual-big .visual-cuvee{font-size:clamp(32px,4vw,48px); max-width:9ch}
.visual-big .visual-meta{font-size:12px}
.editorial-visual.visual-mini{padding:0; display:grid; place-items:center}
.visual-mini::before{width:72px; height:72px; right:-30px; top:-30px; box-shadow:none}
.visual-mini::after{left:9px; right:9px; bottom:8px}
.visual-initials{font-size:16px; font-weight:700; letter-spacing:.04em}
.product-packshot{width:auto!important; height:auto!important; max-width:100%; max-height:100%; object-fit:contain!important; object-position:center!important; padding:0; background:transparent; mix-blend-mode:multiply; box-sizing:border-box; margin:auto}
.rviz>img.product-packshot{position:absolute!important; inset:18px!important; width:calc(100% - 36px)!important; height:calc(100% - 36px)!important; max-width:none!important; max-height:none!important; object-fit:contain!important; margin:0!important}
.mini>img.product-packshot{position:absolute!important; inset:4px!important; width:calc(100% - 8px)!important; height:calc(100% - 8px)!important; max-width:none!important; max-height:none!important; object-fit:contain!important; margin:0!important}
.pcard-img>img.product-packshot,.phero-img>img.product-packshot{position:absolute!important; inset:18px!important; width:calc(100% - 36px)!important; height:calc(100% - 36px)!important; max-width:none!important; max-height:none!important; object-fit:contain!important; margin:0!important}
.phero-img,.pcard-img{display:grid; place-items:center}
.phero-img .product-packshot,.pcard-img .product-packshot{max-width:calc(100% - 36px); max-height:calc(100% - 36px)}

/* ---------- Fiche produit ---------- */
.product{padding:clamp(40px,5vw,64px) 0 clamp(56px,7vw,88px); animation:fade .4s ease}
.phero{display:grid; grid-template-columns:380px 1fr; gap:clamp(28px,5vw,64px); align-items:center; margin-top:20px}
.phero-img{position:relative; aspect-ratio:3/4; border-radius:26px; overflow:hidden; background:#fff; border:1px solid var(--line); box-shadow:0 40px 60px -34px rgba(29,29,31,.25)}
.phero-img .pimg{height:100%; width:100%; object-fit:cover}
.phero-name{font-size:clamp(32px,4.4vw,50px); font-weight:600; letter-spacing:-.03em; line-height:1.03; margin-top:8px}
.phero-note{font-size:17.5px; line-height:1.6; color:#38383b; margin-top:18px}
.pbuy{margin-top:26px; display:flex; align-items:center; gap:22px; flex-wrap:wrap}
.pblock{margin-top:clamp(44px,6vw,72px)}
.pblock.alt{background:var(--bg2); border-radius:28px; padding:clamp(32px,4vw,52px)}
.pblock-eyebrow{font-size:12.5px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--accent-deep); text-align:center}
.pblock-h{font-size:clamp(24px,3vw,34px); font-weight:600; letter-spacing:-.025em; text-align:center; margin-top:10px}
.pblock-p{font-size:17.5px; line-height:1.65; color:#38383b; max-width:60ch; margin:20px auto 0; text-align:center}
.axes{display:grid; grid-template-columns:repeat(4,1fr); gap:18px; margin-top:34px}
.axe{background:var(--bg2); border-radius:18px; padding:24px}
.axe-t{font-size:17px; font-weight:600; letter-spacing:-.02em; color:var(--accent-deep)}
.axe p{font-size:14.5px; color:var(--muted); line-height:1.5; margin-top:10px}
.axe-head{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
.axe-v{font-size:14px; font-weight:500; color:var(--muted)}
.gauge{margin-top:14px; height:8px; border-radius:999px; background:rgba(156,122,52,.16); overflow:hidden}
.gauge-fill{display:block; height:100%; width:0; border-radius:999px; background:linear-gradient(90deg,var(--accent),var(--accent-deep)); transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
.gauge-fill.in{width:var(--lvl)}
.editorial-visual::before{animation:evfloat 9s ease-in-out infinite}
@keyframes evfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@media(prefers-reduced-motion:reduce){.gauge-fill{transition:none; width:var(--lvl)}.editorial-visual::before{animation:none}}
/* ---------- Calculateur de bouteilles ---------- */
.calc{background:var(--bg2); border-radius:24px; padding:clamp(24px,4vw,40px); margin:36px 0}
.calc-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:18px 24px}
.calc-field{display:flex; flex-direction:column; gap:8px}
.calc-field label{font-size:14px; font-weight:600; color:var(--ink)}
.calc-field input,.calc-field select{font-family:inherit; font-size:15px; padding:12px 14px; border:1px solid var(--line); border-radius:12px; background:var(--bg); color:var(--ink)}
.calc-field input:focus,.calc-field select:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent)}
.calc-out{margin-top:26px; display:grid; grid-template-columns:1fr 1fr; gap:16px}
.calc-card{background:var(--bg); border-radius:16px; padding:22px; text-align:center}
.calc-num{font-size:clamp(34px,5vw,48px); font-weight:600; letter-spacing:-.03em; color:var(--accent-deep); line-height:1}
.calc-lbl{font-size:13px; color:var(--muted); margin-top:8px}
.calc-note{font-size:13.5px; color:var(--muted); margin-top:18px; line-height:1.5}
@media(max-width:560px){.calc-grid,.calc-out{grid-template-columns:1fr}}
/* ---------- Tableaux dans les articles ---------- */
.prose table{width:100%; border-collapse:collapse; margin:24px 0; font-size:15px}
.prose th,.prose td{text-align:left; padding:12px 14px; border-bottom:1px solid var(--line); vertical-align:top}
.prose thead th{font-weight:600; color:var(--ink); border-bottom:2px solid var(--line)}
.prose td a{color:var(--accent-deep); text-decoration:underline}
@media(max-width:560px){.prose thead{display:none}.prose table,.prose tbody,.prose tr,.prose td{display:block}.prose td{border:none; padding:3px 0}.prose tr{border-bottom:1px solid var(--line); padding:14px 0}}
.compo{display:flex; gap:20px; justify-content:center; flex-wrap:wrap; margin-top:30px}
.compo-i{background:var(--bg); border-radius:18px; padding:24px 34px; text-align:center; min-width:200px}
.compo-v{font-size:22px; font-weight:600; letter-spacing:-.02em}
.compo-l{font-size:13px; color:var(--faint); text-transform:uppercase; letter-spacing:.08em; margin-top:6px}
.accs{display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-top:34px}
.acc{background:var(--bg); border-radius:18px; padding:26px}
.acc-t{font-size:19px; font-weight:600; letter-spacing:-.02em}
.acc p{font-size:15px; color:var(--muted); line-height:1.55; margin-top:10px}
.decision-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:30px}
.decision{border-radius:18px; padding:26px; text-align:left; background:var(--bg)}
.decision strong{display:block; font-size:17px; color:var(--accent-deep)}
.decision p{margin-top:9px; color:var(--muted); font-size:15px; line-height:1.55}

@media(max-width:860px){ .pgrid,.axes,.accs{grid-template-columns:1fr 1fr} .phero{grid-template-columns:1fr; justify-items:center; text-align:center} .phero-img{max-width:300px} .pbuy,.rtags{justify-content:center} }
@media(max-width:560px){ .pgrid,.axes,.accs,.decision-grid{grid-template-columns:1fr} }

footer{background:var(--bg2); padding:52px 0 46px}
.foot-in{display:flex; justify-content:space-between; gap:28px; flex-wrap:wrap; align-items:flex-start}
.foot-brand{font-size:18px; font-weight:600; letter-spacing:-.02em}
.foot-brand p{font-size:14px; color:var(--faint); font-weight:400; margin-top:10px; max-width:36ch; line-height:1.5}
.foot-links{display:flex; gap:18px 28px; flex-wrap:wrap; justify-content:flex-end; min-width:0; font-size:14px; color:var(--muted)}
.foot-links a,.foot-links button{cursor:pointer; font:inherit; color:inherit}
.foot-links a:hover,.foot-links button:hover{color:var(--ink)}
.foot-health{margin-top:36px; padding-top:26px; border-top:1px solid var(--border); font-size:13.5px; font-weight:600; color:var(--ink)}
.foot-disc{margin-top:12px; font-size:12.5px; color:var(--faint); line-height:1.6}

.agegate{position:fixed; inset:0; z-index:200; background:rgba(255,255,255,.98); backdrop-filter:blur(6px); display:grid; place-items:center; padding:26px; animation:fade .3s ease}
.agegate-box{max-width:440px; text-align:center}
.agegate .g{width:16px; height:16px; border-radius:50%; background:linear-gradient(150deg,#E7D3A0,#9C7A34); margin:0 auto 20px}
.agegate h2{font-size:28px; font-weight:600; letter-spacing:-.025em; line-height:1.15}
.agegate p{color:var(--muted); font-size:16px; margin-top:14px; line-height:1.5}
.agegate .btns{margin-top:28px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap}
.agegate .health{margin-top:28px; font-size:12.5px; font-weight:600; color:var(--ink)}
.agegate small{display:block; margin-top:8px; font-size:12px; color:var(--faint); font-weight:400}

@keyframes rise{from{opacity:0; transform:translateY(12px)}to{opacity:1; transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

@media(max-width:840px){
  .steps,.cards,.alts,.compare-grid,.duel,.trust-strip{grid-template-columns:1fr}
  .rcard{grid-template-columns:1fr; justify-items:center; text-align:center}
  .rviz{width:min(100%,260px); max-width:260px; height:390px; padding:12px}
  .rnote{max-width:none}
  .rtags,.rbuy{justify-content:center}
  .rmatch{position:static; margin-bottom:10px}
}
@media(max-width:700px){
  .nav-in{height:60px!important; min-height:60px; align-items:center; padding-top:0; padding-bottom:0; position:relative; flex-wrap:nowrap!important}
  .logo{min-width:0; white-space:nowrap}
  .logo-txt{display:inline!important; font-size:16px}
  .nav-toggle{display:flex!important; flex:none}
  .nav-links{display:none!important; position:absolute; z-index:60; top:61px; left:-18px; right:-18px; max-width:none; padding:10px 18px 18px; background:#fff; border-bottom:1px solid var(--ink); box-shadow:0 18px 34px rgba(20,17,12,.12)}
  .nav.is-open .nav-links{display:grid!important; grid-template-columns:1fr; gap:0}
  .nlink,.nlink-cta{display:flex; width:100%; min-height:46px; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); font-size:14px}
  .nlink-cta{border-bottom:0}
  .nlink-cta svg{order:2; width:14px; height:19px}
  .foot-in{display:block}
  .foot-links{justify-content:flex-start; margin-top:28px}
  .catalogue-filters{grid-template-columns:1fr 1fr}
  .catalogue-summary{align-items:flex-start; flex-direction:column}
}
@media(max-width:500px){.catalogue-filters{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important}}

/* ============================================================
   REFONTE EDITORIALE AUDACIEUSE (inspiration Nike)
   Fond blanc, titres geants en capitales, geometrie franche,
   police Archivo + Inter, bouchon qui saute au survol.
   ============================================================ */
@font-face{font-family:'Archivo';src:url('/assets/archivo-latin-wght-normal.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:swap}
:root{--sans:'Archivo',Arial,sans-serif; --display:'Archivo','Arial Narrow',Arial,sans-serif}
body,button,input,select,textarea{font-family:var(--sans);letter-spacing:-.006em}
h1,.hero-photo h1,.page-hero h1{font-family:var(--display);font-weight:900;text-transform:uppercase;letter-spacing:-.025em;line-height:.9}
.hero-photo h1{font-size:clamp(50px,9vw,122px)}
.page-hero h1{font-size:clamp(40px,7vw,84px)}
.h2,.qtitle{font-family:var(--display);font-weight:900;text-transform:uppercase;letter-spacing:-.022em;line-height:.95}
.phero-name{font-family:var(--display);font-weight:900;text-transform:uppercase;letter-spacing:-.02em;line-height:.92}
.pblock-h,.acard-b h3,.step h3,.pcard-name{font-family:var(--display);font-weight:800;letter-spacing:-.012em}
.logo,.logo-txt,.foot-brand-name{font-family:var(--display);font-weight:800;letter-spacing:.005em;text-transform:uppercase}
.logo-txt{font-weight:500}.logo-txt b{font-weight:900}
.btn,.btn-lg,.btn-sm{border-radius:2px;font-weight:600;text-transform:uppercase;letter-spacing:.045em;font-size:14px}
.btn-lg{padding:16px 30px;font-size:15px}
.acard,.trust-strip,.trust-item,.step,.qopt,.qback,.qprog,.qprog i,.acard-cover,.acard-cat,.pcard,.pcard-img,.editorial-visual,.phero-img,.a-cover,.rviz,.calc,.calc *,.gauge,.gauge-fill,.tag,.mini,.compare-chip,.catalogue-search,.compare-search,.decision,.compo,.acc,.pblock.alt{border-radius:0 !important}
.acard{border:1px solid var(--line);box-shadow:none}
.acard:hover{transform:translateY(-6px);box-shadow:0 30px 50px -30px rgba(0,0,0,.32)}
.pcard{border:1px solid var(--line)}
.nlink-cta{text-transform:uppercase;letter-spacing:.05em;font-weight:600;font-size:13px}
.tag{border:1px solid var(--border);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.nav{background:#fff;backdrop-filter:none;border-bottom:1px solid var(--ink)}
.hero-photo .btn-primary{background:#fff;color:var(--ink);position:relative;overflow:visible}
.hero-photo .btn-primary:hover{background:#fff;transform:translateY(-2px)}
.hero-photo .btn-primary::before{content:"";position:absolute;right:18px;top:-3px;width:11px;height:13px;background:#d8b98a;border-radius:3px 3px 1px 1px;opacity:0;pointer-events:none}

function prod(id){ return products().find(p=>p.id===id); }

/* Lien d'achat affilié. Un lien n'apparaît que lorsqu'un caviste affilié
   fournit une URL de tracking vérifiée dans p.aff et que la fiche est marquée
   commerceReady après contrôle du produit et de sa disponibilité. */
function buyLink(p){
  if(p.commerceReady !== true) return null;
  if(p.aff && /awin1\.com|tradedoubler|ikhnaie\.link|clk\.|effiliation|kwanko/i.test(p.aff)) return p.aff;
  return null;
}
function priceText(p){
  const format=value=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2}).format(value);
  if(Number.isFinite(p.price)) return format(p.price);
  if(Number.isFinite(p.priceMin)&&Number.isFinite(p.priceMax)){
    return Math.abs(p.priceMax-p.priceMin)<0.01 ? format(p.priceMin) : `${format(p.priceMin)} – ${format(p.priceMax)}`;
  }
  return 'Prix indisponible';
}
function productAction(p, label='Voir la fiche officielle'){
  const link = buyLink(p);
  if(link) return `<a class="btn btn-accent" href="${link}" target="_blank" rel="sponsored noopener" onclick="track('${p.id}')">Voir l'offre</a>`;
  if(p.sourceUrl) return `<a class="btn btn-ghost" href="${p.sourceUrl}" target="_blank" rel="noopener">${label}</a>`;
  return '';
}

function decisionGuide(p){
  let avoid="vous recherchez un style très différent de son profil principal.";
  if(p.profil.includes('profil_riche_ample')) avoid="vous cherchez avant tout une expression très légère et délicate.";
  else if(p.profil.includes('profil_delicat')) avoid="vous préférez un champagne puissant et résolument vineux.";
  else if(p.profil.includes('profil_frais_vif')) avoid="vous recherchez surtout la rondeur et la puissance.";
  else if(p.profil.includes('profil_fruite')) avoid="vous préférez un registre austère et peu fruité.";
  return {
    choose:`vous cherchez une cuvée pour ${p.pair}, dans un registre ${p.tags.slice(0,2).join(' et ').toLowerCase()}.`,
    avoid
  };
}
