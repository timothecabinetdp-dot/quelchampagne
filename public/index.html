<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuelChampagne Engine</title><style>
:root{--ink:#171611;--paper:#f4f1e9;--gold:#a77d2b;--line:#d8d1c3;--muted:#706a60}*{box-sizing:border-box}body{margin:0;font:16px/1.5 Arial,sans-serif;color:var(--ink);background:var(--paper)}header{background:var(--ink);color:#fff;padding:44px clamp(20px,6vw,90px)}header small{color:#dbba72;text-transform:uppercase;letter-spacing:.16em;font-weight:700}h1{font-size:clamp(38px,7vw,76px);line-height:1;margin:12px 0}header p{color:#d9d5cc;max-width:720px;font-size:19px}.wrap{max-width:1300px;margin:auto;padding:36px 22px 80px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.metric,.panel{background:#fff;border:1px solid var(--line);padding:22px}.metric b{display:block;font-size:34px}.metric span{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1.6fr;gap:20px;margin-top:20px}.panel h2{margin-top:0;font-size:25px}label{display:block;font-weight:700;margin:14px 0 6px}select,input,button{width:100%;min-height:44px;padding:10px;border:1px solid #aaa59a;background:#fff;font:inherit}button{margin-top:18px;background:var(--gold);color:#fff;border:0;font-weight:800;cursor:pointer}.results{display:grid;gap:10px}.result{border-top:1px solid var(--line);padding:15px 0}.result:first-child{border-top:0}.result strong{font-size:20px}.result div{color:var(--muted)}.bar{height:8px;background:#e8e3d8;margin-top:8px}.bar i{display:block;height:100%;background:var(--gold)}.status{display:inline-block;padding:5px 9px;background:#e3f1e7;color:#185e31;font-weight:700;font-size:12px}@media(max-width:800px){.metrics{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}@media(max-width:480px){.metrics{grid-template-columns:1fr}}
</style></head><body><header><small>Base autonome · administration</small><h1>QuelChampagne Engine</h1><p>Contrôler la couverture de la base et éprouver les recommandations avant toute connexion au site public.</p></header><main class="wrap"><div class="metrics" id="metrics"></div><div class="grid"><section class="panel"><h2>Tester une recherche</h2><form id="form"><label>Moment</label><select name="occasion"><option value="occ_apero">Apéritif</option><option value="occ_diner">Repas</option><option value="occ_cadeau">Cadeau</option><option value="occ_fete">Célébration</option></select><label>Style</label><select name="preset"><option value="balanced">Équilibré</option><option value="fresh">Vif et minéral</option><option value="fruity">Rond et fruité</option><option value="gastronomic">Gastronomique</option><option value="complex">Complexe</option><option value="delicate">Délicat</option></select><label>Budget maximum</label><input name="budgetMax" type="number" value="80"><button>Calculer</button></form></section><section class="panel"><div class="status">MOTEUR ACTIF</div><h2>Recommandations</h2><div class="results" id="results"></div></section></div><section class="panel" style="margin-top:20px"><h2>Couverture documentaire</h2><div id="coverage"></div></section></main><script>
const metrics=document.getElementById('metrics'),coverage=document.getElementById('coverage'),results=document.getElementById('results'),form=document.getElementById('form');
const esc=s=>String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
async function quality(){const q=await fetch('/v1/quality').then(r=>r.json());metrics.innerHTML=[['Références',q.total],['Confiance moyenne',q.evidence.averageConfidence+' %'],['Objectif 200',q.readiness.progressPercent+' %'],['Offres disponibles',q.coverage.availableOffers+' %']].map(([l,v])=>'<div class="metric"><b>'+v+'</b><span>'+l+'</span></div>').join('');coverage.innerHTML=Object.entries(q.coverage).map(([k,v])=>'<div style="margin:12px 0"><strong>'+esc(k)+'</strong> · '+v+' %<div class="bar"><i style="width:'+v+'%"></i></div></div>').join('')}
async function run(e){e&&e.preventDefault();const d=new FormData(form);const body={request:{occasion:d.get('occasion'),preset:d.get('preset'),budgetMax:Number(d.get('budgetMax')),availableOnly:true},limit:5};const p=await fetch('/v1/recommendations',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json());results.innerHTML=p.results.map((x,i)=>'<article class="result"><strong>'+(i+1)+'. '+esc(x.record.identity.cuvee)+'</strong><div>'+esc(x.record.identity.producer)+' · '+x.record.commerce.priceEur.toLocaleString('fr-FR')+' €</div><div>'+esc(x.assessment.strengths.join(' · '))+'</div></article>').join('')||'<p>Aucun résultat.</p>'}form.addEventListener('submit',run);quality();run();
</script></body></html>
